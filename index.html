<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>奶蛙宇宙贡献度看板</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --track: #cde2fb;
  --hover: rgba(42, 120, 214, 0.08);
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --neutral: #898781;
  --lv0: #86b6ef;
  --lv1: #5598e7;
  --lv2: #2a78d6;
  --lv3: #1c5cab;
  --lv4: #184f95;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --track: #0d366b;
    --hover: rgba(57, 135, 229, 0.12);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
a { color: var(--s1); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 18px 20px 60px; }
.meta { font-size: 12px; color: var(--muted); }

/* 顶栏 */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.top h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
.top #status { margin-left: auto; }
#status.error { color: var(--critical); }
input[type=search] { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); }
.sk { display: grid; grid-template-columns: 30px minmax(170px, 230px) 104px minmax(140px, 1fr) 92px; gap: 10px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--grid); }
.sk i { display: block; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--grid) 25%, var(--hover) 50%, var(--grid) 75%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk i { animation: none; } }

/* 布局 */
.grid { display: grid; gap: 14px; margin-top: 14px; }
.main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; }
.side { display: grid; gap: 14px; }
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 1000px) { .main, .two { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.card h2 { font-size: 15px; margin: 0 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.card h2 .meta { font-weight: 400; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 14px; }
.kpi .label { font-size: 12px; color: var(--ink-2); }
.kpi .value { font-size: 24px; font-weight: 600; line-height: 1.3; }
.kpi .note { font-size: 11.5px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--track); margin: 6px 0 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 3px; min-width: 3px; }

/* 筛选与标签 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.chip { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--axis); background: transparent; color: var(--ink-2); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip b { font-weight: 600; margin-left: 3px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 16px; padding: 0 6px; border: 1px solid var(--axis); border-radius: 10px; color: var(--ink-2); white-space: nowrap; }
.tag.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--neutral); }
.tag.st.good::before { background: var(--good); }
.tag.st.warning::before { background: var(--warning); }
.tag.st.serious::before { background: var(--serious); }
.tag.st.critical::before { background: var(--critical); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend svg { vertical-align: -3px; margin-right: 3px; }

/* 排行榜 */
.lb-head, .lb-row { display: grid; grid-template-columns: 30px minmax(170px, 230px) 104px minmax(140px, 1fr) 92px; gap: 10px; align-items: center; }
.lb-head { font-size: 11.5px; color: var(--muted); padding: 2px 4px 6px; border-bottom: 1px solid var(--axis); }
.lb-row { padding: 6px 4px; border-bottom: 1px solid var(--grid); }
.lb-row:hover { background: var(--hover); }
.rk { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
.rk.top3 { color: var(--ink); }
.who { display: flex; gap: 8px; align-items: center; min-width: 0; }
.who img { width: 26px; height: 26px; border-radius: 50%; background: var(--grid); flex: none; }
.who .name { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.who .sub { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lv { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.bar { display: flex; align-items: center; height: 16px; }
.bar .seg { height: 14px; flex: none; }
.bar .seg.p { background: var(--s1); }
.bar .seg.m { background: var(--s2); }
.bar .seg.c { background: var(--s3); }
.bar .seg + .seg { margin-left: 2px; }
.bar .seg:last-of-type { border-radius: 0 4px 4px 0; }
.bar .v { margin-left: 6px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.more { margin-top: 8px; text-align: center; }
.more button { font: inherit; font-size: 12px; background: none; border: none; color: var(--s1); cursor: pointer; }

/* 公式：一行主公式，下面是左右对齐的定义表 */
.formula { padding: 14px 16px; background: var(--page); border-radius: 8px; }
.fmain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--grid); }
.fmain .lhs { font-weight: 600; }
.fmain .sum { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.fmain .sum span { font-size: 22px; }
.fmain .sum small { font-size: 10px; color: var(--muted); margin-top: 2px; }
.fdefs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 14px; margin: 12px 0 0; font-size: 13px; align-items: baseline; }
.fdefs dt { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.fdefs dd { margin: 0; font-variant-numeric: tabular-nums; }
.fdefs .k { font-weight: 600; }
.fdefs .note { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.sw.s1 { background: var(--s1); }
.sw.s2 { background: var(--s2); }
.sw.s3 { background: var(--s3); }
.sw.none { border: 1px solid var(--axis); }
.examples { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; margin: 12px 0 0; font-size: 12.5px; color: var(--ink-2); }
.examples dt { color: var(--muted); }
.examples dd { margin: 0; }
.examples b { color: var(--ink); font-variant-numeric: tabular-nums; }
.formula-ref { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.nw { white-space: nowrap; }

/* 进化路径 */
.cond { display: flex; flex-wrap: wrap; gap: 6px; }
.segbar { display: flex; gap: 2px; height: 28px; margin: 10px 0 6px; }
.segbar div { display: flex; align-items: center; gap: 4px; padding-left: 6px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; min-width: 4px; }
.segbar .good { background: var(--good); }
.segbar .neutral { background: var(--neutral); }
.segbar .critical { background: var(--critical); }
.flow { font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
.step { cursor: pointer; }
.step:hover path { opacity: 0.85; }

/* 图表 */
.chart svg { display: block; width: 100%; height: auto; }
.ax { fill: var(--muted); font-size: 11px; }
.ax-l { fill: var(--ink-2); font-size: 11px; }
.gl { stroke: var(--grid); stroke-width: 1; }
.bl { stroke: var(--axis); stroke-width: 1; }
.mk { fill: var(--s1); pointer-events: none; }
.ln { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.peak { fill: var(--ink-2); font-size: 11px; font-weight: 600; pointer-events: none; }
.cnt { fill: var(--ink); font-size: 16px; font-weight: 700; }
.hit { fill: transparent; }
.hit:hover { fill: var(--hover); }
.dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.dot:hover { stroke: var(--ink); }
.zone { fill: var(--warning); fill-opacity: 0.16; }
.zone-line { fill: none; stroke: var(--warning); stroke-width: 1.5; }
.hbars { display: grid; gap: 2px; }
.hb { display: grid; grid-template-columns: 220px 1fr 80px; gap: 8px; align-items: center; padding: 4px 2px; font-size: 13px; }
.hb:hover { background: var(--hover); }
.hb-b { height: 14px; }
.hb-b i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { font-variant-numeric: tabular-nums; text-align: right; }
.factors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sub-h { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 14px 0 6px; }
.ex-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-chips span { padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--ink-2); }
.ex-chips b { color: var(--ink); font-variant-numeric: tabular-nums; }
table.mx { table-layout: fixed; font-size: 12px; }
table.mx th, table.mx td { white-space: normal; text-align: center; padding: 6px 4px; border: 1px solid var(--grid); position: static; cursor: default; }
table.mx th { background: transparent; }
table.mx th .k { font-weight: 600; color: var(--ink); }
table.mx tr > th:first-child { text-align: left; width: 72px; }
table.mx td.na { color: var(--muted); }
table.mx td.other { text-align: left; color: var(--ink-2); }
.factors h3 { font-size: 12.5px; font-weight: 600; margin: 0 0 4px; color: var(--ink-2); }
@media (max-width: 700px) { .factors { grid-template-columns: 1fr; } }

/* M-Team 对照 */
.map { display: grid; grid-template-columns: 1fr 20px 1.3fr; gap: 7px 6px; align-items: center; font-size: 13px; }
.map .from { text-align: right; color: var(--ink-2); }
.map .arrow { text-align: center; color: var(--muted); }
.map .to { font-weight: 600; cursor: help; }
.map .to.off { color: var(--muted); font-weight: 400; }

/* 明细表 */
details.card > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details.card[open] > summary { margin-bottom: 10px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
ul.blind { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
ul.blind li { margin: 4px 0; }

#tip { position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 360px; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.6; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18); }
#tip .k { color: var(--muted); }
#tip svg { vertical-align: -4px; }
</style>
</head>
<body>
<svg id="nw-defs" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="nw-body" cx="38%" cy="28%" r="78%"><stop offset="0" stop-color="#ffe27a"/><stop offset="0.55" stop-color="#f6c23e"/><stop offset="1" stop-color="#e1a02a"/></radialGradient>
    <radialGradient id="nw-belly" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#fff8e8"/><stop offset="1" stop-color="#ebddbd"/></radialGradient>
    <radialGradient id="nw-eye" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#8fd86a"/><stop offset="1" stop-color="#3e9b35"/></radialGradient>
    <linearGradient id="nw-shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbf0"/><stop offset="1" stop-color="#e8dcc2"/></linearGradient>
  </defs>
</svg>
<div class="wrap">
  <header class="top">
    <h1><span id="logo"></span>奶蛙宇宙贡献度看板</h1>
    <span class="meta" id="status">正在读取数据…</span>
  </header>

  <section class="kpis" id="kpis" hidden></section>

  <div class="grid main">
    <section class="card">
      <h2>贡献度排行 <span class="meta" id="lb-meta">按魔力排序，悬停查看明细</span></h2>
      <div class="chips" id="chips"></div>
      <div class="legend" style="margin-bottom:8px">
        <span><i style="background:var(--s1)"></i>合入 PR（含规模）</span>
        <span><i style="background:var(--s2)"></i>模型加成</span>
        <span><i style="background:var(--s3)"></i>协作</span>
        <input type="search" id="search" placeholder="搜索账号" style="margin-left:auto;width:150px">
      </div>
      <div class="lb-head"><span>#</span><span>贡献者</span><span>形态</span><span>魔力</span><span>每周魔力</span></div>
      <div id="leaderboard"><div class="empty">正在读取数据…</div></div>
      <div class="more" id="more"></div>
    </section>

    <div class="side">
      <section class="card" id="formula-card"></section>
      <section class="card">
        <h2>奶蛙进化路径 <span class="meta">点击分段或台阶筛选排行</span></h2>
        <div id="path"></div>
      </section>
    </div>
  </div>

  <div class="grid two">
    <section class="card chart">
      <h2>每周活跃贡献者 <span class="meta">单位：人</span></h2>
      <div id="chart-active"><div class="empty">等待数据</div></div>
    </section>
    <section class="card chart">
      <h2>每周合入 PR <span class="meta">单位：个</span></h2>
      <div id="chart-merged"><div class="empty">等待数据</div></div>
    </section>
  </div>

  <div class="grid two">
    <section class="card">
      <h2>合入 PR 的模型分布 <span class="meta">按 commit 的 Co-Authored-By 识别</span></h2>
      <div id="chart-models"><div class="empty">等待数据</div></div>
    </section>
    <section class="card chart">
      <h2>计分因子 <span class="meta">对数压缩：规模越大，边际加分越少</span></h2>
      <div id="factors"></div>
    </section>
  </div>

  <div class="grid two">
    <section class="card chart">
      <h2>合入率与警告线 <span class="meta">每个点是一个人；横轴为对数刻度</span></h2>
      <div id="chart-rate"><div class="empty">等待数据</div></div>
    </section>
    <section class="card">
      <h2>M-Team 规则对照 <span class="meta">悬停查看映射理由</span></h2>
      <div id="mapping"></div>
    </section>
  </div>

  <details class="card" style="margin-top:14px" id="detail">
    <summary>完整明细表</summary>
    <div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
  </details>
  <details class="card" style="margin-top:14px">
    <summary>口径与盲区</summary>
    <ul class="blind" id="blind"></ul>
  </details>
</div>
<div id="tip" role="tooltip"></div>

<script src="engine.js"></script>

<script>
'use strict';

// ---------- 工具 ----------

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (x) => {
  if (x == null) return '—';
  // 0 与 1% 之间保留一位小数，避免把少量非零值显示成 0%
  return x > 0 && x < 0.01 ? `${(x * 100).toFixed(1)}%` : `${Math.round(x * 100)}%`;
};
const fmtDate = (t) => new Date(t + RULES.tzOffsetHours * 3600000).toISOString().slice(0, 10);
const fmtMD = (t) => fmtDate(t).slice(5);
const fmtNum = (n) => n.toLocaleString('en-US');
const fmt1 = (x) => (Math.round(x * 10) / 10).toFixed(1);
// 魔力展示取整用向下取整，与门槛比较的结果一致
const fmtBonus = (x) => fmtNum(Math.floor(x));
const daysAgo = (t, now) => {
  const d = Math.floor((now - t) / DAY);
  return d <= 0 ? '今天' : `${d} 天前`;
};
const LEVEL_INK = ['#0b0b0b', '#0b0b0b', '#ffffff', '#ffffff', '#ffffff'];
const STAGES = {
  pending: { name: '蛙卵', icon: 'egg' },
  failed: { name: '未孵化', icon: 'unhatched' },
};

function niceStep(max) {
  for (const step of [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]) if (max / step <= 5) return step;
  return Math.ceil(max / 5);
}

function roundedTop(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

// 奶蛙各形态的图标（64×64），按表情包形象重绘：梨形黄色身体、奶白肚皮、深灰色小手和脚，
// 绿色鼓眼或黑豆眼；大笑版眯眼张大嘴、露出上下两排牙。渐变定义在页面顶部的隐藏 SVG（#nw-defs）中。
const NW = { line: '#b9811b', hand: '#5e5e66', mouth: '#6b3f12', dark: '#2a1a10', pupil: '#121212', ring: '#8e7cf0', star: '#fab219' };
// 钟形身体：头窄、下身宽，头宽约为最宽处的一半
const NW_PEAR = 'M32 6C24 6 20.5 12 20.5 20C20.5 25 18 29 15.5 33.5C11.5 40.5 10.5 48 14.5 54C18 59 24.5 60.5 32 60.5C39.5 60.5 46 59 49.5 54C53.5 48 52.5 40.5 48.5 33.5C46 29 43.5 25 43.5 20C43.5 12 40 6 32 6Z';
const NW_ARM_DOWN = 'M20 28.5C15.5 32 12 38 11 43C10.6 45.4 13.6 46.4 14.6 44.4C16 40 18.4 35.4 21.6 32Z';
const NW_ARM_IN = 'M19.5 30C15 34.5 15.5 42 22 46C24 47.4 26.4 45.2 24.8 43.2C21.6 40.6 20.8 36.4 22 33Z';
const NW_ARM_UP = 'M20.5 27C15.5 24.5 10.5 19 8.8 13.8C8.2 11.8 11 10.8 12 12.7C13.8 16.7 17.2 21 22 24.5Z';
const nwFill = (d, sw = 1.2) => `<path d="${d}" fill="url(#nw-body)" stroke="${NW.line}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const nwBelly = (cx, cy, rx, ry) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#nw-belly)"/>`;
const nwPaw = (x, y, rx = 3, ry = 3.4, rot = 0) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})" fill="${NW.hand}"/>`;
const nwMirror = (svg) => `<g transform="matrix(-1 0 0 1 64 0)">${svg}</g>`;
// 左臂与手，右侧镜像
const nwArms = (path, hx, hy, rot = 0) => {
  const one = `${nwFill(path, 1.1)}${nwPaw(hx, hy, 3, 3.4, rot)}`;

    return `<path d="${d}Z" fill="#fff"/>`;
  };

const tipEl = $('tip');
function moveTip(e) {
  const pad = 14;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  if (x + tipEl.offsetWidth > innerWidth - 8) x = e.clientX - tipEl.offsetWidth - pad;
  if (y + tipEl.offsetHeight > innerHeight - 8) y = e.clientY - tipEl.offsetHeight - pad;
  tipEl.style.left = `${x}px`;
  tipEl.style.top = `${y}px`;
}
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) {
    tipEl.style.display = 'none';
    return;
  }
  tipEl.innerHTML = t.dataset.tip;
  tipEl.style.display = 'block';
  moveTip(e);
});
document.addEventListener('mousemove', (e) => { if (tipEl.style.display === 'block') moveTip(e); });

function curveChart({ fn, xMin, xMax, ticks, xLabel, logX = false, yMax = null, yFmt = (v) => `+${v}`, tickFmt = (t) => (t >= 1000 ? `${t / 1000}k` : t), tipFmt = (x, y) => `${xLabel} ${fmtNum(x)} → +${y.toFixed(2)}` }) {
  const W = 240;
  const H = 140;
  const pad = { l: 40, r: 18, t: 10, b: 36 };
  const top = yMax ?? Math.ceil(fn(xMax) * 4) / 4;
  const sx = (v) => pad.l + (W - pad.l - pad.r) * (logX ? Math.log10(v / xMin) / Math.log10(xMax / xMin) : (v - xMin) / (xMax - xMin));
  const sy = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (const v of [0, top]) {
    s += `<line class="${v ? 'gl' : 'bl'}" x1="${pad.l}" x2="${W - pad.r}" y1="${sy(v)}" y2="${sy(v)}"/><text class="ax" x="${pad.l - 4}" y="${sy(v) + 4}" text-anchor="end">${yFmt(v)}</text>`;
  }
  // 按几何间隔取样，线性横轴上对数曲线开头的陡峭段也能画平滑
  const lo = Math.max(xMin, 1e-3);
  const samples = xMin < lo ? [xMin] : [];
  for (let i = 0; i <= 80; i++) samples.push(lo * (xMax / lo) ** (i / 80));
  const pts = samples.map((v) => `${sx(v).toFixed(1)},${sy(fn(v)).toFixed(1)}`);
  s += `<polyline class="ln" points="${pts.join(' ')}"/>`;
  ticks.forEach((t) => {
    s += `<circle class="dot" cx="${sx(t)}" cy="${sy(fn(t))}" r="4" data-tip="${esc(tipFmt(t, fn(t)))}"/>`;
    s += `<text class="ax" x="${sx(t)}" y="${H - pad.b + 14}" text-anchor="middle">${tickFmt(t)}</text>`;
  });
  s += `<text class="ax-l" x="${W - pad.r}" y="${H - 4}" text-anchor="end">${esc(xLabel)} →</text>`;
  return `${s}</svg>`;
}

// 系列 × 档位的档位加成矩阵；格子底色随加成加深
function modelMatrix() {
  const families = Object.keys(RULES.families);
  const tiers = RULES.modelTiers.filter((t) => t.key !== 'other');
  const maxBonus = Math.max(...tiers.map((t) => t.bonus));
  const tint = (bonus) => Math.round(6 + (bonus / (maxBonus || 1)) * 44);
  const other = [...RULES.models.filter((m) => m.tier === 'other'), RULES.modelNone].map((m) => m.short).join('、');
  const rows = families.map((f) => `<tr><th>${esc(f)}<br><span class="meta">最新 ${RULES.families[f].latest}</span></th>${tiers.map((t) => {
    const ms = RULES.models.filter((m) => m.family === f && m.tier === t.key);
    if (!ms.length) return '<td class="na">—</td>';
    const how = t.versioned === false ? '不看版本' : '再乘版本系数';
    const tip = ms.map((m) => `<b>${esc(m.label)}</b>　档位加成 +${t.bonus}，${how}<br><span class="k">识别：</span>${esc(m.pattern.source)}`).join('<br>');
    return `<td style="background:color-mix(in srgb, var(--s2) ${tint(t.bonus)}%, transparent)" data-tip="${esc(tip)}">${ms.map((m) => esc(m.short)).join('<br>')}</td>`;
  }).join('')}</tr>`).join('');
  return `<table class="mx">
    <tr><th></th>${tiers.map((t) => `<th>${esc(t.label)}<br><span class="k">+${t.bonus}</span></th>`).join('')}</tr>
    ${rows}
    <tr><th>其他</th><td colspan="${tiers.length}" class="other">${esc(other)}　×1</td></tr>
  </table>`;
}

function renderKpis(b) {
  const s = b.summary;
  const ratio = (a, n) => (n ? a / n : null);
  const top = b.people.slice(0, Math.max(1, Math.ceil(b.people.length * 0.2)));
  const totalBonus = b.people.reduce((n, p) => n + p.bonus, 0);
  const topShare = ratio(top.reduce((n, p) => n + p.bonus, 0), totalBonus);
  const inflight = b.people.reduce((n, p) => n + p.inflight, 0);
  const backlog = [...b.people].sort((x, y) => y.inflight - x.inflight)[0];
  const kpis = [
    { label: '贡献者', value: s.contributors, note: `成员 ${s.memberContributors} · 非成员 ${s.outsiders}` },
    { label: '合入 PR', value: fmtNum(s.merged), note: `共开 ${fmtNum(s.prs)} 个 PR` },
    { label: '有人工 review 的合入', value: pct(ratio(s.mergedReviewed, s.merged)), meter: ratio(s.mergedReviewed, s.merged), note: `${s.mergedReviewed} / ${fmtNum(s.merged)}` },
    { label: '作者自己合入', value: pct(ratio(s.mergedSelf, s.merged)), meter: ratio(s.mergedSelf, s.merged), note: `${fmtNum(s.mergedSelf)} / ${fmtNum(s.merged)}` },
    { label: '带 AI 共同作者的合入', value: pct(ratio(s.mergedAi, s.merged)), meter: ratio(s.mergedAi, s.merged), note: `${fmtNum(s.mergedAi)} / ${fmtNum(s.merged)}` },
    { label: '前 20% 的人占魔力', value: pct(topShare), meter: topShare, note: `${top.length} 人` },
    { label: '进行中 PR', value: inflight, note: backlog?.inflight ? `最多 ${backlog.login}：${backlog.inflight}` : '' },
  ];
  $('kpis').innerHTML = kpis.map((k) => `
    <div class="card kpi">
      <div class="label">${esc(k.label)}</div>
      <div class="value">${esc(k.value)}</div>
      ${k.meter != null ? `<div class="meter"><i style="width:${(k.meter * 100).toFixed(2)}%"></i></div>` : ''}
      <div class="note">${esc(k.note)}</div>
    </div>`).join('');
  $('kpis').hidden = false;
}

function levelChip(p) {
  if (p.level === null) {
    const st = STAGES[p.newbie.status];
    const text = p.newbie.status === 'pending' ? `${st.name} ${p.newbie.daysLeft} 天` : st.name;
    return `<span class="lv">${frogIcon(st.icon, 20)}${esc(text)}</span>`;
  }
  const L = RULES.levels[p.level];
  return `<span class="lv">${frogIcon(L.icon, 20)}${esc(L.name)}</span>`;
}

function flagTags(p) {
  const tags = [];
  if (!p.member) tags.push('<span class="tag">非成员</span>');
  if (p.newbie.anomaly) tags.push('<span class="tag st serious">新手异常</span>');
  if (p.warn) tags.push('<span class="tag st warning">合入率警告</span>');
  if (p.dormant) tags.push('<span class="tag st">冬眠</span>');
  return tags.join('');
}

function personTip(p, now) {
  const nb = RULES.newbie;
  const n = p.newbie;
  const newbieText = n.status === 'passed'
    ? `通过（第 ${n.passDay} 天）`
    : `${n.status === 'failed' ? '未孵化' : `蛙卵，剩 ${n.daysLeft} 天`}（PR ${n.merged}/${nb.merged}，活跃周 ${n.activeWeeks}/${nb.activeWeeks}）`;
  const stage = p.level === null ? STAGES[p.newbie.status] : RULES.levels[p.level];
  const models = [...p.modelMix.values()].sort((a, b) => b.count - a.count).slice(0, 3).map((m) => `${esc(m.label)} ${m.count}`).join('，');
  const lines = [
    `<b>${esc(p.login)}</b>　${frogIcon(stage.icon, 18)} ${esc(stage.name)}${stage.tagline ? `<span class="k">　${esc(stage.tagline)}</span>` : ''}`,
    `<span class="k">魔力</span> <b>${fmtBonus(p.bonus)}</b> = PR ${fmt1(p.bonusPr)} + 模型加成 ${fmt1(p.bonusModel)} + 协作 ${fmt1(p.bonusCollab)}`,
    `<span class="k">合入 PR</span> ${p.merged} / 开 ${p.opened}　<span class="k">协作</span> ${p.collab}　<span class="k">合入率</span> ${pct(p.rate)}`,
    `<span class="k">改动行</span> ${fmtNum(p.lines)}　<span class="k">commit</span> ${fmtNum(p.commits)}`,
  ];
  if (models) lines.push(`<span class="k">模型</span> ${models}`);
  lines.push(`<span class="k">新手考核</span> ${newbieText}`);
  if (p.next) lines.push(`<span class="k">距${esc(RULES.levels[p.next.level].name)}</span> ${esc(p.next.gaps.join('，') || '下周回放后升级')}`);
  if (p.inflight) lines.push(`<span class="k">进行中 PR</span> ${p.inflight}`);
  lines.push(`<span class="k">首次贡献</span> ${fmtDate(p.firstAt)}　<span class="k">最近</span> ${daysAgo(p.lastAt, now)}`);
  return lines.join('<br>');
}

function sparkline(p, weeks, max) {
  const H = 18;
  const bw = Math.max(3, Math.min(5, Math.floor(90 / weeks.length) - 1));
  let svg = `<svg width="${weeks.length * (bw + 1)}" height="${H}" aria-hidden="true">`;
  weeks.forEach((w, i) => {
    const v = p.weekly.get(w.start) || 0;
    const h = v ? Math.max(2, (v / max) * H) : 1;
    svg += `<rect x="${i * (bw + 1)}" y="${H - h}" width="${bw}" height="${h}" rx="1" style="fill:var(${v ? '--s1' : '--grid'})"/>`;
  });
  return `${svg}</svg>`;
}

function renderChips() {
  const b = state.board;
  const keys = Object.keys(FILTERS).filter((k) => FILTERS[k].chip || k === state.filter);
  $('chips').innerHTML = keys.map((k) => {
    const n = b ? b.people.filter(FILTERS[k].fn).length : 0;
    const extra = !FILTERS[k].chip ? ' ×' : '';
    return `<button class="chip${state.filter === k ? ' on' : ''}" data-filter="${k}">${esc(FILTERS[k].label)}<b>${b ? n : ''}</b>${extra}</button>`;
  }).join('');
}

function renderLeaderboard() {
  const b = state.board;
  renderChips();
  if (!b) return;
  const list = visiblePeople();
  const shown = state.showAll ? list : list.slice(0, TOP_N);
  const max = Math.max(1, ...b.people.map((p) => p.bonus));
  const weekMax = Math.max(1, ...b.people.flatMap((p) => [...p.weekly.values()]));
  $('leaderboard').innerHTML = shown.length ? shown.map((p) => {
    // 条宽按全员最高魔力缩放，右侧留 44px 给数值标签
    const seg = (cls, v) => (v >= 0.05 ? `<i class="seg ${cls}" style="width:calc((100% - 44px) * ${(v / max).toFixed(4)})"></i>` : '');
    return `
    <div class="lb-row" data-tip="${esc(personTip(p, b.now))}">
      <span class="rk${p.rank <= 3 ? ' top3' : ''}">${p.rank}</span>
      <div class="who">
        <img src="https://github.com/${encodeURIComponent(p.login)}.png?size=52" alt="" loading="lazy">
        <div>
          <div class="name"><a href="https://github.com/${encodeURIComponent(p.login)}" target="_blank" rel="noopener">${esc(p.login)}</a>${flagTags(p)}</div>
          <div class="sub">${p.merged} PR · ${p.collab} 协作 · ${pct(p.rate)}</div>
        </div>
      </div>
      <span>${levelChip(p)}</span>
      <div class="bar">${seg('p', p.bonusPr)}${seg('m', p.bonusModel)}${seg('c', p.bonusCollab)}<span class="v">${fmtBonus(p.bonus)}</span></div>
      <span>${sparkline(p, b.weeks, weekMax)}</span>
    </div>`;
  }).join('') : '<div class="empty">没有符合条件的人</div>';
  $('more').innerHTML = list.length > TOP_N
    ? `<button id="toggle-all">${state.showAll ? '收起' : `显示全部 ${list.length} 人`}</button>`
    : '';
  $('lb-meta').textContent = `${list.length} 人 · 按魔力排序，悬停查看明细`;
}

function renderPath(b) {
  const nb = RULES.newbie;
  const L = RULES.levels;
  let html = `<div class="cond">
    <span class="tag">${frogIcon('egg', 14)} 蛙卵：首次贡献起 ${nb.days} 天</span>
    <span class="tag">合入 PR ≥ ${nb.merged}</span>
    <span class="tag">活跃周 ≥ ${nb.activeWeeks}</span>
    <span class="tag st serious" data-tip="${esc(`考核期内开 PR ≥ ${nb.anomaly.opened} 个且合入比 &lt; ${pct(nb.anomaly.rate)}，标记「新手异常」。最近 ${nb.anomaly.graceHours} 小时内开的 PR 不计。`)}">异常线</span>
  </div>`;
  if (b) {
    const s = b.summary;
    const parts = [
      ['passed', '孵化成蝌蚪', 'good', s.passed, L[0].icon],
      ['pending', '蛙卵（考核中）', 'neutral', s.pending, STAGES.pending.icon],
      ['failed', '未孵化', 'critical', s.failed, STAGES.failed.icon],
    ];
    const total = s.passed + s.pending + s.failed || 1;
    html += `<div class="segbar">${parts.filter((x) => x[3]).map(([k, label, cls, n, icon]) => `<div class="${cls}" style="flex:${n}" data-filter="${k}" data-tip="${esc(`${label} ${n} 人（${pct(n / total)}），点击筛选`)}">${n / total >= 0.1 ? `${frogIcon(icon, 18)}${n}` : ''}</div>`).join('')}</div>
      <div class="legend">${parts.map(([, label, cls, n]) => `<span><i style="background:var(--${cls})"></i>${label} ${n}</span>`).join('')}</div>`;
  }
  html += '<div class="flow">孵化成蝌蚪后，四项同时达标逐级进化；合入率跌破降级线退回上一形态</div>';

  const W = 470;
  const labelW = 46;
  const base = 214;
  const stepW = (W - labelW - 4) / L.length;
  const rows = ['在组', '魔力', '协作', '合入率', '降级线'];
  let svg = `<svg viewBox="0 0 ${W} ${base + 92}" role="img" aria-label="奶蛙进化阶梯与门槛">`;
  svg += `<line class="bl" x1="${labelW}" x2="${W - 4}" y1="${base}" y2="${base}"/>`;
  rows.forEach((r, k) => { svg += `<text class="ax-l" x="${labelW - 6}" y="${base + 20 + k * 16}" text-anchor="end">${r}</text>`; });
  L.forEach((lv, i) => {
    const x = labelW + stepW * i + 3;
    const w = stepW - 6;
    const h = 36 + i * 28;
    const cx = x + w / 2;
    const people = b ? b.people.filter((p) => p.level === i) : [];
    const names = people.slice(0, 15).map((p) => esc(p.login)).join('、') + (people.length > 15 ? ` 等 ${people.length} 人` : '');
    const rule = i === 0 ? '通过新手考核' : `升级：在组 ≥ ${lv.weeks} 周、魔力 ≥ ${lv.bonus}、协作 ≥ ${lv.collab}、合入率 ≥ ${pct(lv.rate)}<br>降级：合入率 &lt; ${pct(lv.demote)}`;
    const tip = `${frogIcon(lv.icon, 22)} <b>${esc(lv.name)}</b>　<span class="k">${esc(lv.tagline)}</span><br>${rule}${b ? `<br><br>${people.length} 人${names ? `：${names}` : ''}` : ''}`;
    svg += `<g class="step" data-filter="lv${i}" data-tip="${esc(tip)}">`;
    svg += `<path d="${roundedTop(x, base - h, w, h, 4)}" style="fill:var(--lv${i})"/>`;
    svg += `<text x="${cx}" y="${base - 10}" text-anchor="middle" style="fill:${LEVEL_INK[i]};font-size:12.5px;font-weight:600">${esc(lv.name)}</text>`;
    svg += frogIcon(lv.icon, 32, { x: cx - 16, y: base - h - 34 });
    if (b) svg += `<text class="cnt" x="${cx}" y="${base - h - 40}" text-anchor="middle">${people.length}</text>`;
    const cells = i === 0 ? ['通过考核', '—', '—', '—', '—'] : [`≥ ${lv.weeks} 周`, `≥ ${lv.bonus}`, `≥ ${lv.collab}`, `≥ ${pct(lv.rate)}`, `< ${pct(lv.demote)}`];
    cells.forEach((c, k) => { svg += `<text class="ax" x="${cx}" y="${base + 20 + k * 16}" text-anchor="middle">${esc(c)}</text>`; });
    svg += '</g>';
  });
  svg += '</svg>';
  $('path').innerHTML = `${html}<div class="chart">${svg}</div>`;
}

function columnChart(weeks, key) {
  const W = 560;
  const H = 200;
  const pad = { l: 34, r: 6, t: 18, b: 24 };
  const max = Math.max(1, ...weeks.map((w) => w[key]));
  const step = niceStep(max);
  const top = Math.ceil(max / step) * step;
  const band = (W - pad.l - pad.r) / weeks.length;
  const bw = Math.min(24, band * 0.62);
  const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  const every = Math.ceil(42 / band);
  const peak = weeks.reduce((m, w, i) => (w[key] > weeks[m][key] ? i : m), 0);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top; v += step) {
    s += `<line class="${v ? 'gl' : 'bl'}" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text class="ax" x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  weeks.forEach((w, i) => {
    const x0 = pad.l + band * i;
    s += `<rect class="hit" x="${x0}" y="${pad.t}" width="${band}" height="${H - pad.t - pad.b}" data-tip="${esc(`<b>${fmtDate(w.start)} 当周</b><br>活跃贡献者 ${w.active} 人<br>合入 PR ${w.merged} 个`)}"/>`;
  });
  weeks.forEach((w, i) => {
    const cx = pad.l + band * i + band / 2;
    const v = w[key];
    if (v > 0) s += `<path class="mk" d="${roundedTop(cx - bw / 2, y(v), bw, y(0) - y(v), 4)}"/>`;
    if (i === peak && v > 0) s += `<text class="peak" x="${cx}" y="${y(v) - 5}" text-anchor="middle">${v}</text>`;
    if (i % every === 0) s += `<text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle">${fmtMD(w.start)}</text>`;
  });
  return `${s}</svg>`;
}

function modelChart(b) {
  const rows = b.summary.models.filter((m) => m.count > 0).sort((x, y) => y.count - x.count);
  if (!rows.length) return '<div class="empty">没有合入 PR</div>';
  const max = Math.max(...rows.map((m) => m.count));
  const total = rows.reduce((n, m) => n + m.count, 0);
  return `<div class="hbars">${rows.map((m) => `
    <div class="hb" data-tip="${esc(`<b>${esc(m.label)}</b><br>合入 PR ${m.count} 个，占 ${pct(m.count / total)}<br>模型系数 ×${m.weight}`)}">
      <span>${esc(m.label)} ${m.weight > 1 ? `<span class="meta">×${m.weight}</span>` : ''}</span>
      <span class="hb-b"><i style="width:${(m.count / max) * 100}%"></i></span>
      <span class="hb-v">${fmtNum(m.count)} <span class="meta">${pct(m.count / total)}</span></span>
    </div>`).join('')}</div>`;
}

function rateChart(b) {
  const pts = b.people.filter((p) => p.resolved > 0);
  if (!pts.length) return '<div class="empty">还没有已收尾的 PR</div>';
  const W = 560;
  const H = 244;
  const pad = { l: 40, r: 10, t: 12, b: 44 };
  const maxX = Math.max(20, ...pts.map((p) => p.resolved)) * 1.15;
  const x = (v) => pad.l + ((W - pad.l - pad.r) * Math.log10(v)) / Math.log10(maxX);
  const y = (r) => pad.t + (H - pad.t - pad.b) * (1 - r);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="合入率与已收尾 PR 数">`;
  [0, 0.25, 0.5, 0.75, 1].forEach((r) => {
    s += `<line class="${r ? 'gl' : 'bl'}" x1="${pad.l}" x2="${W - pad.r}" y1="${y(r)}" y2="${y(r)}"/>`;
    s += `<text class="ax" x="${pad.l - 6}" y="${y(r) + 4}" text-anchor="end">${r * 100}%</text>`;
  });
  [1, 10, 50, 100, 200, 500, 1000].filter((t) => t <= maxX).forEach((t) => {
    s += `<text class="ax" x="${x(t)}" y="${H - pad.b + 16}" text-anchor="middle">${t}</text>`;
  });
  s += `<text class="ax-l" x="${W - pad.r}" y="${H - 6}" text-anchor="end">已收尾 PR 数 →</text>`;
  const lines = RULES.warnLines.filter((l) => l.resolved < maxX);
  if (lines.length) {
    let d = `M${x(lines[0].resolved)},${y(0)}`;
    let edge = '';
    lines.forEach((l, i) => {
      const xEnd = x(Math.min(maxX, lines[i + 1]?.resolved ?? maxX));
      d += `V${y(l.rate)}H${xEnd}`;
      edge += `${i ? 'V' : `M${x(l.resolved)},`}${y(l.rate)}H${xEnd}`;
    });
    d += `V${y(0)}Z`;
    s += `<path class="zone" d="${d}"/><path class="zone-line" d="${edge}"/>`;
    s += `<text class="ax-l" x="${W - pad.r - 4}" y="${y(0) - 8}" text-anchor="end">警告区</text>`;
  }
  [...pts].sort((a, b2) => a.resolved - b2.resolved).forEach((p) => {
    const tip = `<b>${esc(p.login)}</b><br>合入率 ${pct(p.rate)}（${p.merged} / ${p.resolved}）${p.warn ? '<br>触发合入率警告' : ''}`;
    s += `<circle class="dot" cx="${x(p.resolved)}" cy="${y(p.rate)}" r="5" data-tip="${esc(tip)}"/>`;
  });
  return `${s}</svg>`;
}

const mainModel = (p) => {
  const top = [...p.modelMix.values()].sort((a, b) => b.count - a.count)[0];
  return top ? top.label : '—';
};
const stageName = (p) => (p.level === null ? STAGES[p.newbie.status].name : RULES.levels[p.level].name);

  { key: 'rank', label: '#', num: true, value: (p) => p.rank },
  { key: 'login', label: '贡献者', value: (p) => p.login.toLowerCase(), cell: (p) => esc(p.login) },
  { key: 'level', label: '形态', value: (p) => (p.level ?? -1), cell: (p) => stageName(p) },
  { key: 'newbie', label: '新手考核', value: (p) => p.newbie.status, cell: (p) => ({ passed: '通过', pending: '考核中', failed: '未通过' }[p.newbie.status]) },
  { key: 'bonus', label: '魔力', num: true, value: (p) => p.bonus, cell: (p) => fmtBonus(p.bonus) },
  { key: 'bonusPr', label: 'PR 分', num: true, value: (p) => p.bonusPr, cell: (p) => fmt1(p.bonusPr) },
  { key: 'bonusModel', label: '模型加成', num: true, value: (p) => p.bonusModel, cell: (p) => fmt1(p.bonusModel) },
  { key: 'bonusCollab', label: '协作分', num: true, value: (p) => p.bonusCollab, cell: (p) => fmt1(p.bonusCollab) },
  { key: 'merged', label: '合入 PR', num: true, value: (p) => p.merged },
  { key: 'opened', label: '开 PR', num: true, value: (p) => p.opened },
  { key: 'collab', label: '协作', num: true, value: (p) => p.collab },
  { key: 'rate', label: '合入率', num: true, value: (p) => p.rate ?? -1, cell: (p) => pct(p.rate) },
  { key: 'lines', label: '改动行', num: true, value: (p) => p.lines, cell: (p) => fmtNum(p.lines) },
  { key: 'commits', label: 'commit', num: true, value: (p) => p.commits, cell: (p) => fmtNum(p.commits) },
  { key: 'model', label: '主要模型', value: (p) => mainModel(p), cell: (p) => esc(mainModel(p)) },

  { key: 'lastAt', label: '最近活动', value: (p) => p.lastAt, cell: (p) => daysAgo(p.lastAt, state.board.now) },
];

function renderTable() {
  if (!state.board) return;
  const col = COLUMNS.find((c) => c.key === state.sort.key);
  const rows = visiblePeople().sort((x, y) => {
    const a = col.value(x);
    const c = col.value(y);
    return (a < c ? -1 : a > c ? 1 : 0) * state.sort.dir || x.rank - y.rank;
  });
  $('table').querySelector('thead').innerHTML = `<tr>${COLUMNS.map((c) => `<th class="${c.num ? 'num' : ''}" data-key="${c.key}">${esc(c.label)}${c.key === state.sort.key ? (state.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr>`;
  $('table').querySelector('tbody').innerHTML = rows.map((p) => `<tr>${COLUMNS.map((c) => `<td class="${c.num ? 'num' : ''}">${c.cell ? c.cell(p) : c.value(p)}</td>`).join('')}</tr>`).join('');
  $('detail').querySelector('summary').textContent = `完整明细表（${rows.length} 人）`;
}

function renderAll() {
  const b = state.board;
  renderKpis(b);
  renderLeaderboard();
  renderPath(b);
  $('chart-active').innerHTML = columnChart(b.weeks, 'active');
  $('chart-merged').innerHTML = columnChart(b.weeks, 'merged');
  $('chart-models').innerHTML = modelChart(b);
  $('chart-rate').innerHTML = rateChart(b);
  renderTable();
}

const fmtDateTime = (t) => new Date(t + RULES.tzOffsetHours * 3600000).toISOString().slice(0, 16).replace('T', ' ');
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 60) return `${m} 分钟前`;
  if (m < 48 * 60) return `${Math.round(m / 60)} 小时前`;
  return `${Math.round(m / 1440)} 天前`;
}

// 上传脚本把 Map 展开成数组，这里还原成渲染层使用的结构
function hydrate(d) {
  for (const p of d.people) {
    p.weekly = new Map(p.weekly);
    p.modelMix = new Map(p.modelMix.map((m, i) => [i, m]));
  }
  return d;
}

async function loadBoard() {
  renderSkeleton();
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.board = hydrate(await res.json());
    renderAll();
    renderBlind(state.board.limits);
    setStatus(`${state.board.org} · 数据更新于 ${fmtDateTime(state.board.now)}（UTC+8，${ago(state.board.now)}）`);
  } catch (err) {
    console.error(err);
    $('leaderboard').innerHTML = '<div class="empty">还没有可展示的数据</div>';
    setStatus(`读取数据失败：${err.message}`, true);
  }
}

document.addEventListener('click', (e) => {
  const f = e.target.closest('[data-filter]');
  if (f && state.board) setFilter(f.dataset.filter);
  if (e.target.id === 'toggle-all') {
    state.showAll = !state.showAll;
    renderLeaderboard();
  }
  const th = e.target.closest('#table th');
  if (th) {
    const key = th.dataset.key;
    state.sort = { key, dir: state.sort.key === key ? -state.sort.dir : (key === 'rank' || key === 'login' ? 1 : -1) };
    renderTable();
  }
});
$('search').addEventListener('input', (e) => {
  state.search = e.target.value;
  if (state.board) {
    renderLeaderboard();
    renderTable();
  }
});

$('logo').innerHTML = frogIcon('face', 30);
renderFormula();
renderFactors();
renderMapping();
renderPath(null);
renderChips();
loadBoard();
</script>
