<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶蛙宇宙贡献度看板</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/tokens.css">
<!-- 读取 data/board.json 后加载 engine.js、assets/derive.js、icons.js、kit.js，再执行下方 type="text/x-nw-page" 的页面脚本 -->
<script src="assets/boot.js"></script>
<style>
  /* 本页布局；颜色、字号、圆角、动效一律用令牌 */

  /* ── 首屏大卡：桌面两栏，手机重排（周选择器提到导语之前） ── */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 440px; column-gap: var(--s-10);
    grid-template-areas: "date pond" "story pond" "kpis kpis" "sel sel" "foot foot"; }
  .hero-date { grid-area: date; padding: var(--s-6) 0 0 28px; }
  .hero-story { grid-area: story; padding: var(--s-4) 0 0 28px; min-width: 0; }
  .hero-pond { grid-area: pond; padding: var(--s-6) 28px 0 0; align-self: start; }
  .hero-kpis { grid-area: kpis; margin: var(--s-6) 28px 0; padding-top: var(--s-5); border-top: 1px solid var(--line-soft); }
  .hero-sel { grid-area: sel; margin: var(--s-6) 28px 0; padding-top: var(--s-5); border-top: 1px solid var(--line-soft); min-width: 0; }
  .hero-foot { grid-area: foot; padding: var(--s-3) 28px var(--s-5); }
  .hero .dateline { gap: var(--s-2) 10px; }
  .hero .stepper { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .hero .back-now[hidden] { display: none; }
  .hero .lede { min-height: calc(1.85em * 3); }
  .hero .headline .pname { font-weight: inherit; }

  /* ── 周选择器：上下两个面板（合入 / 活跃），各自一根基线 ── */
  .wk-h { display: flex; align-items: center; gap: var(--s-3) var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-2); }
  .wk-h .title { font-size: var(--fs-sm); font-weight: 650; color: var(--ink-2); }
  .wk-h .hint { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
  .wk { position: relative; touch-action: pan-y; cursor: pointer; user-select: none; -webkit-user-select: none; border-radius: var(--r-md); }
  .wk.is-drag { cursor: grabbing; }
  .wk.is-static .sel-band, .wk.is-static .wk-pill { transition: none; }
  .wk:focus-visible { outline-offset: 6px; }
  .wk svg { display: block; overflow: visible; }
  .wk .pl { font-size: var(--fs-2xs); font-weight: 650; fill: var(--ink-3); }
  .wk .pv { font-size: 10px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
  .wk .b-m { fill: var(--viz-dim); transition: fill var(--dur-3) var(--ease-out); }
  .wk .b-a { fill: var(--viz-dim-2); transition: fill var(--dur-3) var(--ease-out); }
  .wk .b-m.on { fill: var(--leaf); }
  .wk .b-a.on { fill: var(--water); }
  .wk .z { fill: var(--viz-muted); }
  .wk .sel-band { fill: var(--leaf-wash); transition: transform var(--dur-4) var(--ease-spring); }
  .wk .hov-band { fill: var(--surface-hover); opacity: 0; transition: opacity var(--dur-1); }
  :root[data-theme="dark"] .wk .hov-band { fill: var(--surface-hover); }
  .wk .mo { font-size: 10.5px; fill: var(--ink-3); transition: opacity var(--dur-2); }
  .wk-frog { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; z-index: 2; }
  .wk-frog .frog { filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.12)); }
  .wk-pill { position: absolute; left: 0; top: 0; height: 20px; padding: 0 8px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-2xs); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--leaf); color: var(--on-leaf); pointer-events: none; transition: transform var(--dur-4) var(--ease-spring), background-color var(--dur-2); }
  .wk-pill.is-live { background: var(--yolk); color: var(--yolk-ink); }
  :root[data-theme="dark"] .wk-pill.is-live { color: var(--ink-inverse); }
  .wk-pill .live-dot { width: 6px; height: 6px; background: var(--yolk-deep); }
  :root[data-theme="dark"] .wk-pill .live-dot { background: var(--ink-inverse); }
  .wk-flag { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: var(--r-pill); font-size: 10px; font-weight: 700; color: var(--yolk-ink); background: var(--yolk-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--yolk-deep) 40%, transparent); white-space: nowrap; pointer-events: none; transition: opacity var(--dur-2); }
  .wk-flag .live-dot { width: 5px; height: 5px; background: var(--yolk-deep); }
  .wk-flag.is-dot span { display: none; }
  .wk-flag.is-dot { padding: 0 6px; gap: 0; }

  /* ── 三张「这一周的人」卡 ── */
  .people .card { display: flex; flex-direction: column; height: 100%; }
  .people .card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .people .card-head .n { margin-left: 2px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sub-h { display: flex; align-items: center; gap: 6px; margin: 0 0 var(--s-2); font-size: var(--fs-xs); font-weight: 650; color: var(--ink-2); }
  .sub-h .ic { color: var(--ink-3); }
  .sub-h .aside { margin-left: auto; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
  .sub-h .cnt { color: var(--ink); font-variant-numeric: tabular-nums; }
  .sep { height: 1px; margin: var(--s-4) 0; background: var(--line-soft); }

  /* 魔力榜 */
  .board { margin: 0 calc(-1 * var(--s-5)); }
  .board .lrow { --cols: 22px minmax(0, 1fr) 48px 38px; gap: 10px; --row-h: 44px; padding: 4px var(--s-5); }
  .board .lrow .who .sub { margin-top: 1px; }
  .board .rank { width: auto; text-align: center; } /* 通用 .rank 固定 28px 且右对齐，会溢出本页 22px 的名次列、贴住头像；名次在列内水平居中 */
  .board .dl { justify-self: end; }
  .board .sub .out { color: var(--water-ink); font-weight: 600; }
  .board-more { display: none; }

  /* 名次变化 */
  .mv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(64px, 96px) auto; align-items: center; gap: 10px; min-height: 40px; }
  .mv .rk { font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .mv .rk b { color: var(--ink); font-weight: 650; }
  .mv .drange { margin: 0 var(--s-1); }
  .faces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .face { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 8px; border-radius: var(--r-lg); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); cursor: pointer; transition: background-color var(--dur-1); }
  .face:hover { background: var(--surface-hover); }
  .face .who-txt { line-height: 1.25; }
  .face .nm { font-size: var(--fs-sm); }
  .enter-row { display: flex; align-items: center; gap: 10px; margin-top: var(--s-3); padding: 8px 10px; border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line-soft); font-size: var(--fs-xs); color: var(--ink-3); }
  .enter-row > span:last-child, .hero .lede { text-wrap: pretty; }
  .enter-row b { color: var(--ink-2); font-weight: 650; }
  .mini-empty { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-lg); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); font-size: var(--fs-sm); color: var(--ink-3); }
  .mini-empty b { color: var(--ink-2); font-weight: 650; }

  /* 进化 */
  .evo-list { display: grid; gap: 6px; }
  .ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 10px 6px 8px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--yolk-soft) 55%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--yolk-deep) 18%, transparent); cursor: pointer; }
  :root[data-theme="dark"] .ev { background: color-mix(in srgb, var(--yolk) 7%, var(--surface)); }
  .ev .ev-tr { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); }
  .ev .ev-tr .ic { width: 12px; height: 12px; }
  .upc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(112px, 42%); align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
  .upc .meter { height: 5px; }
  .upc .uv { display: flex; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: var(--fs-2xs); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .upc .uv b { color: var(--ink-2); font-weight: 650; }
  .upc .eta { color: var(--leaf-ink); font-weight: 650; }
  .upc .eta.soon { color: var(--yolk-ink); }

  .card-foot .link { margin-left: auto; }
  .card-foot .ic { vertical-align: -2px; }

  /* ── 趋势 ── */
  .trend .card-head { padding-bottom: var(--s-1); }
  .trend .chart { margin-top: var(--s-2); }

  /* ── 组织健康 ── */
  .health-kpis { padding: var(--s-1) var(--s-5) var(--s-5); }
  .health-kpis .kpi-v .val { font-size: var(--fs-2xl); }
  .hgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s-3); padding: 0 var(--s-5) var(--s-5); }
  .hc { padding: var(--s-3) var(--s-4) var(--s-4); min-width: 0; }
  .hc-l { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .hc-l .ic { color: var(--ink-3); }
  .hc-l > span:not(.info) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .hc-l .l-short { display: none; }
  .hc-l .info { margin-left: auto; color: var(--ink-4); cursor: help; display: inline-flex; }
  .hc-v { margin-top: 6px; font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .hc-v small { margin-left: 3px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
  .hc .meter { margin-top: 10px; height: 4px; }
  .hc-n { margin-top: 8px; font-size: var(--fs-2xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .hc-n .pname { font-size: var(--fs-2xs); }

  .page-foot { margin-top: var(--s-10); }

  /* ── 平板 ── */
  @media (max-width: 1100px) {
    .hero { grid-template-columns: 1fr; grid-template-areas: "date" "story" "pond" "kpis" "sel" "foot"; }
    .hero-date, .hero-story { padding-right: 28px; }
    .hero-pond { padding: var(--s-5) 28px 0; }
    .hgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .hgrid > .hc { grid-column: span 2; }
    .hgrid > .hc:nth-child(n + 4) { grid-column: span 3; }
  }
  /* ── 手机：重新排版。选择器提到标题前，形态池塘放到 KPI 之后 ── */
  @media (max-width: 720px) {
    .hero { grid-template-areas: "date" "sel" "story" "kpis" "pond" "foot"; }
    .hero-date { padding: var(--s-4) var(--s-4) 0; }
    .hero-sel { margin: var(--s-3) var(--s-4) 0; padding-top: 0; border-top: 0; }
    .hero-story { padding: var(--s-5) var(--s-4) 0; }
    .hero-kpis { margin: var(--s-5) var(--s-4) 0; padding-top: var(--s-4); }
    .hero-pond { padding: var(--s-5) var(--s-4) 0; }
    .hero-foot { padding: var(--s-3) var(--s-4) var(--s-4); }
    .hero .lede { min-height: 0; }
    .hero .dateline .asof { display: none; }
    .wk-h { margin-bottom: 4px; }
    .wk-h .title, .wk-h .hint { display: none; }
    .board .lrow { --cols: 22px minmax(0, 1fr) 44px 36px; }
    .board:not(.is-open) .lrow:nth-child(n + 6) { display: none; }
    .board-more { display: flex; justify-content: center; padding: var(--s-2) 0 0; }
    .mv { grid-template-columns: minmax(0, 1fr) auto; }
    .mv .drange { display: none; }
    .hgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 var(--s-4) var(--s-4); }
    .hgrid > .hc, .hgrid > .hc:nth-child(n + 4) { grid-column: auto; }
    .hgrid > .hc:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .health-kpis { padding: var(--s-1) var(--s-4) var(--s-4); }
    .health-kpis.kpis { --n: 3 !important; }
    .health-kpis .kpi { padding: 0 0 0 var(--s-3); border-top: 0; border-left: 1px solid var(--line-soft); }
    .health-kpis .kpi:first-child { padding-left: 0; border-left: 0; }
    .health-kpis .kpi:last-child:nth-child(odd) { grid-column: auto; }
    .health-kpis .kpi-s { display: block; white-space: normal; line-height: 1.5; }
    .hc-n { white-space: normal; line-height: 1.5; }
    .hc-l > .ic:first-child { display: none; }
    .hc-l .l-full { display: none; }
    .hc-l .l-short { display: inline; }
    .health-kpis .kpi-s .dot { display: none; }
    .health-kpis .kpi-s .nowrap { display: block; }
    .board .lrow { gap: var(--s-2); }
    .health-kpis .kpi-v .val { font-size: var(--fs-xl); }
    .health-kpis .kpi-l { font-size: var(--fs-xs); }
    .health-kpis .kpi-s { font-size: var(--fs-2xs); }
  }
</style>
</head>
<body>
<header id="appbar"></header>

<main class="page">
  <!-- 首屏：这一周发生了什么 -->
  <section class="card card-hero hero" id="hero" aria-label="周快照">
    <div class="hero-date"><div class="dateline" id="dateline"></div></div>
    <div class="hero-story">
      <h1 class="headline" id="headline" aria-live="polite"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="hero-pond" id="heroPond"></div>
    <div class="hero-kpis kpis" id="heroKpis" style="--n:5"></div>
    <div class="hero-sel">
      <div class="wk-h">
        <span class="title">25 周 · 选一周回看</span>
        <span class="legend"><span class="key" style="--k:var(--leaf)">合入 PR</span><span class="key" style="--k:var(--water)">活跃贡献者</span></span>
        <span class="hint only-kbd">点击或拖动，<kbd>←</kbd><kbd>→</kbd> 切周，<kbd>T</kbd> 回本周</span>
      </div>
      <div class="wk" id="wk" tabindex="0" role="slider" aria-label="选择周" aria-valuemin="1"></div>
    </div>
    <div class="hero-foot"><p class="footnote" id="heroNote"></p></div>
  </section>

  <!-- 这一周的人 -->
  <section class="section">
    <div class="sec-h">
      <div><span class="eyebrow" id="peopleEyebrow">本周</span><h2>这一周的人</h2><p>谁拿到最多魔力、谁在总榜上冲、谁刚进化或快要进化</p></div>
    </div>
    <div class="grid stretch people">
      <div class="span-4">
        <div class="card">
          <div class="card-head"><div><div class="card-title"><span class="card-icon leaf" aria-hidden="true" id="icBoard"></span><span id="boardTitle">本周魔力榜</span></div><div class="card-sub" id="boardSub"></div></div></div>
          <div class="card-body"><div class="rows board" id="board" role="list"></div><div class="board-more"><button type="button" class="btn btn-sm btn-ghost" id="boardMore"></button></div></div>
          <div class="card-foot"><span id="boardFoot"></span><a class="link" href="ranking.html" data-screen="c2">完整排行榜<span id="icArrow1"></span></a></div>
        </div>
      </div>
      <div class="span-4">
        <div class="card">
          <div class="card-head"><div><div class="card-title"><span class="card-icon water" aria-hidden="true" id="icMoves"></span>名次变化</div><div class="card-sub" id="movesSub">总榜名次，与上周末相比</div></div></div>
          <div class="card-body" id="moves"></div>
          <div class="card-foot"><span id="movesFoot"></span></div>
        </div>
      </div>
      <div class="span-4 md-span-12">
        <div class="card">
          <div class="card-head"><div><div class="card-title"><span class="card-icon yolk" aria-hidden="true" id="icEvo"></span>进化动态</div><div class="card-sub">形态只看魔力，不降级</div></div></div>
          <div class="card-body" id="evo"></div>
          <div class="card-foot"><span>ETA = 还差的魔力 ÷ 近 4 周周均</span><a class="link" href="pond.html" data-screen="c5">形态池<span id="icArrow2"></span></a></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 25 周走势：每周活跃贡献者与每周合入 PR -->
  <section class="section trend">
    <div class="sec-h">
      <div><span class="eyebrow">趋势</span><h2>25 周走势</h2><p>选中的周高亮；点任意一根柱子切到那一周</p></div>
    </div>
    <div class="grid">
      <div class="card card-pad span-6">
        <div class="card-head"><div><div class="card-title">每周活跃贡献者</div><div class="card-sub">提 PR、合入或协作的人 · 单位：人</div></div></div>
        <div id="chartActive"></div>
      </div>
      <div class="card card-pad span-6">
        <div class="card-head"><div><div class="card-title">每周合入 PR</div><div class="card-sub">当周合入的 PR 总数 · 单位：个</div></div></div>
        <div id="chartMerged"></div>
      </div>
    </div>
  </section>

  <!-- 组织健康（累计，不随周切换） -->
  <section class="section">
    <div class="sec-h">
      <div><span class="eyebrow">累计</span><h2>组织健康</h2><p>从有记录的第一周到现在，不随上面的周切换</p></div>
    </div>
    <div class="card">
      <div class="card-head"><div><div class="card-title"><span class="card-icon" aria-hidden="true" id="icHealth"></span>全部时间</div><div class="card-sub" id="healthSub"></div></div></div>
      <div class="kpis health-kpis" id="healthKpis" style="--n:3"></div>
      <div class="hgrid" id="healthGrid"></div>
    </div>
  </section>

  <p class="footnote page-foot" id="pageFoot"></p>
</main>

<script type="text/x-nw-page">
(function () {
  const K = NWK, { esc, icon, mag, fmt } = K;
  const { W, LV, last: LAST } = NW;
  const $ = (s) => document.querySelector(s);
  const n = (x) => `<span class="n">${x}</span>`;
  // 占比：小于 10% 保留一位小数；非零但不到 0.1% 时不写成 0%
  const share = (a, b) => { const x = b ? a / b : 0; return x === 0 ? '0%' : x < 0.001 ? '不到 0.1%' : fmt.pct(x, x < 0.1 ? 1 : 0); };
  const nw = (h) => `<span class="nowrap">${h}</span>`;

  K.appHeader($('#appbar'), { active: 'c1' });
  $('#icBoard').innerHTML = icon('zap', 15);
  $('#icMoves').innerHTML = icon('trending-up', 15);
  $('#icEvo').innerHTML = icon('sparkles', 15);
  $('#icHealth').innerHTML = icon('activity', 15);
  $('#icArrow1').innerHTML = icon('arrow-right', 13);
  $('#icArrow2').innerHTML = icon('arrow-right', 13);

  // ───────── 派生：某一周的全部事实（缓存） ─────────
  const wkv = (p, i) => (i < 0 ? 0 : p.wk.get(W[i]) || 0);
  const isNew = (p, i) => p.started[i] && !(i > 0 && p.started[i - 1]);
  const cache = new Map();
  function facts(i) {
    if (cache.has(i)) return cache.get(i);
    const s = NW.weekSnapshot(i);
    const ps = i > 0 ? NW.weekSnapshot(i - 1) : null;
    const magic = s.top.reduce((a, x) => a + x.v, 0);
    const pmagic = ps ? ps.top.reduce((a, x) => a + x.v, 0) : 0;
    const faces = NW.people.filter((p) => isNew(p, i));
    const pfaces = i > 0 ? NW.people.filter((p) => isNew(p, i - 1)).length : 0;
    const prevMax = (k) => Math.max(0, ...NW.weeks.slice(0, i).map((w) => w[k]));
    // 记录：从第 5 周起算，避免「第 2 周 2 人也算新高」这种噪声
    const recA = i >= 4 && s.active > 0 && s.active > prevMax('active');
    const recM = i >= 4 && s.merged > 0 && s.merged > prevMax('merged');
    // 这一周魔力榜：只排有魔力的人；名次变化 = 前一周同一张榜
    const prevRank = new Map(i > 0 ? NW.people.filter((p) => wkv(p, i - 1) > 0.005).sort((a, b) => wkv(b, i - 1) - wkv(a, i - 1) || a.login.localeCompare(b.login)).map((p, k) => [p.login, k + 1]) : []);
    const board = s.top.slice().sort((a, b) => b.v - a.v || a.p.login.localeCompare(b.p.login)).map((x, k) => ({ p: x.p, v: x.v, rank: k + 1, move: isNew(x.p, i) ? null : prevRank.has(x.p.login) ? prevRank.get(x.p.login) - (k + 1) : undefined }));
    // 总榜名次变化：上一周末已经有魔力（有名次意义）的人才算升降
    const R = NW.ranksAt(i), PR = i > 0 ? NW.ranksAt(i - 1) : new Map();
    const movers = [], entered = [];
    for (const p of NW.people) {
      if (!p.started[i] || isNew(p, i)) continue;
      const before = i > 0 ? p.cum[i - 1] : 0;
      if (before <= 0.005) { if (p.cum[i] > 0.005) entered.push(p); continue; }
      const m = PR.get(p.login) - R.get(p.login);
      if (m > 0) movers.push({ p, from: PR.get(p.login), to: R.get(p.login), m });
    }
    movers.sort((a, b) => b.m - a.m || a.to - b.to);
    // 新面孔按当周魔力排序
    const facesR = faces.map((p) => ({ p, v: wkv(p, i), r: R.get(p.login) })).sort((a, b) => b.v - a.v || a.r - b.r);
    // 即将进化：第 i 周末已孵化、未到最高级、近 4 周有魔力
    const upcoming = [];
    for (const p of NW.people) {
      const l = p.levels[i];
      if (!p.started[i] || l === null || l >= LV.length - 1) continue;
      let sum = 0; for (let k = i - 3; k <= i; k++) sum += wkv(p, k);
      const pace = sum / 4;
      if (pace <= 0) continue;
      const nb = LV[l + 1].bonus, gap = nb - p.cum[i];
      upcoming.push({ p, l, gap, pace, eta: Math.ceil(gap / pace), prog: (p.cum[i] - LV[l].bonus) / (nb - LV[l].bonus) });
    }
    upcoming.sort((a, b) => a.eta - b.eta || a.gap - b.gap);
    const evos = [
      ...s.upgraded.map((p) => ({ p, from: p.levels[i - 1], to: p.levels[i], kind: 'up' })).sort((a, b) => b.to - a.to || a.p.login.localeCompare(b.p.login)),
      ...s.newlyHatched.map((p) => ({ p, from: null, to: p.levels[i], kind: 'hatch' })),
    ];
    const f = { i, s, ps, magic, pmagic, faces: facesR, pfaces, recA, recM, board, movers, entered, upcoming, evos, live: i === LAST };
    cache.set(i, f);
    return f;
  }

  // ───────── 摘要：标题 + 导语 ─────────
  function story(f) {
    const { s, ps, i } = f;
    const name = K.week.name(i), prev = K.week.prevName(i);
    const nh = s.newlyHatched.length, nu = s.upgraded.length;
    let title;
    if (f.recA && f.recM) title = '活跃与合入，<mark>双双创新高</mark>';
    else if (f.recM) title = `合入量<mark>创新高</mark>`;
    else if (f.recA) title = `活跃人数<mark>创新高</mark>`;
    else if (nh || nu) title = `<mark>${[nh ? `${nh} 人孵化` : '', nu ? `${nu} 人进化` : ''].filter(Boolean).join('，')}</mark>`;
    else if (s.top.length) title = `${K.pname(s.top[0].p.login, { avatar: false })} 领跑${i === LAST ? '本周' : '这一周'}`;
    else title = '池塘很安静';

    const cmp = (a, b, unit) => (!ps ? '' : a === b ? `，和${prev}持平` : `，比${prev}${a > b ? '多' : '少'} ${fmt.int(Math.abs(a - b))}${unit}`);
    let t = i === LAST ? `${K.week.asOf()}，` : '';
    if (!s.active && !s.merged) t += `${name}没有人活跃，也没有合入。`;
    else t += `${name} ${n(s.active)} 人活跃${cmp(s.active, ps ? ps.active : 0, ' 人')}；合入 ${n(fmt.int(s.merged))} 个 PR${cmp(s.merged, ps ? ps.merged : 0, ' 个')}。`;
    if (s.top.length) {
      const [a, b] = s.top;
      t += `${K.pname(a.p.login)} 以 ${n(mag(a.v))} 魔力领跑${b ? `，比第二名多 ${n(mag(a.v - b.v))}` : ''}。`;
    }
    const byLv = new Map();
    s.upgraded.forEach((p) => { const l = p.levels[i]; if (!byLv.has(l)) byLv.set(l, []); byLv.get(l).push(p); });
    const sp = (h) => (/人$/.test(h) ? h : `${h} `);
    const ups = [...byLv].sort((a, b) => b[0] - a[0]).map(([l, list]) => `${sp(K.people(list, { max: 2 }))}进化为${LV[l].name}`);
    if (nh) ups.push(`${sp(K.people(s.newlyHatched, { max: 2 }))}完成孵化`);
    if (ups.length) t += `${ups.join('，')}。`;
    if (f.faces.length) {
      const out = f.faces.filter((x) => !x.p.member).length;
      const k = f.faces.length;
      const tail = k === 1 ? (out ? '，来自组织外' : '，是组织成员') : out === k ? '，全部来自组织外' : out ? `，其中 ${out} 位来自组织外` : '';
      t += `新面孔 ${k} 位${tail}。`;
    }
    return { title, lede: t };
  }

  // 新面孔的组织构成（§7.2 口径：1 人时写「来自组织外 / 组织成员」）
  function facesNote(f) {
    const k = f.faces.length, out = f.faces.filter((x) => !x.p.member).length;
    return !k ? '' : k === 1 ? (out ? '来自组织外' : '组织成员') : out === k ? '全部来自组织外' : out ? `其中 ${out} 位来自组织外` : '全部是组织成员';
  }

  // ───────── KPI ─────────
  function kpiItems(f) {
    const { s, ps } = f;
    const prev = K.week.prevName(f.i);
    const k = f.faces.length;
    const facesSub = k ? facesNote(f) : `${f.live ? '本周' : '这一周'}没有新面孔`;
    const stack = k ? `<span class="av-stack">${f.faces.slice(0, 3).map((x) => `<span data-person="${esc(x.p.login)}" tabindex="0" role="button" aria-label="${esc(x.p.login)}，查看档案">${K.avatar(x.p.login, 20)}</span>`).join('')}${k > 3 ? `<span class="av-more">+${k - 3}</span>` : ''}</span>` : '';
    const evo = s.newlyHatched.length + s.upgraded.length;
    const pevo = ps ? ps.newlyHatched.length + ps.upgraded.length : 0;
    return [
      { key: 'active', icon: 'users', label: '活跃贡献者', value: s.active, prev: ps ? ps.active : null, ref: ps ? `${prev} ${ps.active}` : null, sub: '提 PR、合入或协作的人' },
      { key: 'merged', icon: 'git-merge', label: '合入 PR', value: s.merged, prev: ps ? ps.merged : null, ref: ps ? `${prev} ${fmt.int(ps.merged)}` : null, sub: `占 25 周合入的 <b>${share(s.merged, NW.summary.merged)}</b>` },
      { key: 'magic', icon: 'zap', label: '产出魔力', value: f.magic, f: mag, prev: ps ? f.pmagic : null, ref: ps ? `${prev} ${mag(f.pmagic)}` : null, sub: `<b>${s.top.length}</b> 人获得魔力` },
      { key: 'faces', icon: 'user-plus', label: '新面孔', value: k, prev: ps ? f.pfaces : null, ref: ps ? `${prev} ${f.pfaces}` : null, sub: `${stack}<span>${facesSub}</span>` },
      { key: 'evo', icon: 'sparkles', label: '孵化与进化', value: evo, prev: ps ? pevo : null, ref: ps ? `${prev} ${pevo}` : null, sub: `<b>${s.newlyHatched.length}</b> 人孵化 · <b>${s.upgraded.length}</b> 人进化` },
    ];
  }
  function renderKpis(f, first) {

  }

  // ───────── 池塘：数字从旧值滚到新值 ─────────
  let pondPrev = null;
  // 切周时就地更新六个站（不整块重绘）：悬停中的站不会丢 tooltip，奶蛙不闪
  function renderPond(i, first) {

    const hv = old.querySelector('.st:hover');
    if (hv && K.canHover()) K.tip.show(esc(hv.getAttribute('data-tip')), hv);
    pondPrev = now;
  }

  // ───────── 周选择器 ─────────
  const wk = $('#wk');
  wk.setAttribute('aria-valuemax', String(W.length));
  const frogEl = document.createElement('div');
  frogEl.className = 'wk-frog';
  frogEl.setAttribute('aria-hidden', 'true');
  const pill = document.createElement('div');
  pill.className = 'wk-pill';
  pill.setAttribute('aria-hidden', 'true');
  const flag = document.createElement('div');
  flag.className = 'wk-flag';
  flag.setAttribute('aria-hidden', 'true');
  flag.innerHTML = '<i class="live-dot"></i><span>进行中</span>';
  const maxM = Math.max(...NW.weeks.map((w) => w.merged));
  const maxA = Math.max(...NW.weeks.map((w) => w.active));
  let G = null;
  function geom() {
    const w = wk.clientWidth || 600;
    const sm = w < 560;
    const padL = sm ? 30 : 46;
    const head = sm ? 30 : 38, mh = sm ? 48 : 64, gap = sm ? 10 : 12, ah = sm ? 26 : 32, lab = 26;
    const n = W.length;
    const band = (w - padL) / n;
    const bw = Math.min(18, Math.max(4, band * 0.56));
    const baseM = head + mh, topA = baseM + gap, baseA = topA + ah;
    return { w, h: baseA + lab, sm, padL, head, mh, gap, ah, baseM, topA, baseA, band, bw, n, frog: sm ? 22 : 28,
      cx: (i) => padL + i * band + band / 2,
      yM: (v) => baseM - (v / maxM) * mh,
      hA: (v) => (v / maxA) * ah };
  }
  const barPath = (x, y0, y1, bw, r) => `M${x.toFixed(2)} ${y0}V${(y1 + r).toFixed(2)}Q${x.toFixed(2)} ${y1.toFixed(2)} ${(x + r).toFixed(2)} ${y1.toFixed(2)}H${(x + bw - r).toFixed(2)}Q${(x + bw).toFixed(2)} ${y1.toFixed(2)} ${(x + bw).toFixed(2)} ${(y1 + r).toFixed(2)}V${y0}Z`;
  function buildWk() {
    G = geom();
    wk.classList.add('is-static');
    requestAnimationFrame(() => requestAnimationFrame(() => wk.classList.remove('is-static')));
    const { w, h, padL, head, baseM, topA, baseA, band, bw, cx, yM, hA } = G;
    let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
    s += `<rect class="hov-band" x="0" y="${head - 8}" width="${band}" height="${baseA - head + 8 + 4}" rx="7"/>`;
    s += `<rect class="sel-band" x="0" y="${head - 8}" width="${band}" height="${baseA - head + 8 + 4}" rx="7"/>`;
    // 面板标签与基线：上 = 合入，下 = 活跃（不共用 y 轴）
    s += `<text class="pl" x="0" y="${head + 10}">合入</text><text class="pv" x="0" y="${head + 23}">${G.sm ? '' : `最高 ${fmt.int(maxM)}`}</text>`;
    s += `<text class="pl" x="0" y="${topA + 10}">活跃</text><text class="pv" x="0" y="${topA + 23}">${G.sm ? '' : `最高 ${maxA}`}</text>`;
    s += `<line class="bl" x1="${padL}" x2="${w}" y1="${baseM + 0.5}" y2="${baseM + 0.5}"/><line class="bl" x1="${padL}" x2="${w}" y1="${baseA + 0.5}" y2="${baseA + 0.5}"/>`;
    NW.weeks.forEach((wd, i) => {
      const x = cx(i) - bw / 2;
      if (wd.merged > 0) { const y = Math.min(yM(wd.merged), baseM - 2); s += `<path class="b-m" data-i="${i}" d="${barPath(x, baseM, y, bw, Math.min(3, bw / 2, (baseM - y) / 2))}"/>`; }
      else s += `<rect class="z" x="${x.toFixed(2)}" y="${baseM - 1.5}" width="${bw.toFixed(2)}" height="1.5" rx=".75"/>`;
      if (wd.active > 0) { const hh = Math.max(2, hA(wd.active)); const y = baseA - hh; s += `<path class="b-a" data-i="${i}" d="${barPath(x, baseA, y, bw, Math.min(3, bw / 2, hh / 2))}"/>`; }
      else s += `<rect class="z" x="${x.toFixed(2)}" y="${baseA - 1.5}" width="${bw.toFixed(2)}" height="1.5" rx=".75"/>`;
    });
    let lastM = -1;
    W.forEach((t, i) => {
      const m = new Date(t + 8 * 3600e3).getUTCMonth();
      if (m !== lastM) { lastM = m; s += `<text class="mo" data-i="${i}" x="${cx(i)}" y="${h - 7}" text-anchor="middle">${m + 1}月</text>`; }
    });
    s += '</svg>';
    wk.innerHTML = s;
    wk.append(flag, pill, frogEl);
    frogEl.innerHTML = K.frog('frog', G.frog);
    if (cur >= 0) { paintWk(); placeFrog(cur, false); }
  }
  function paintWk() {
    if (!G || cur < 0) return;
    const { band, cx, h, w } = G;
    wk.querySelectorAll('.b-m, .b-a').forEach((el) => el.classList.toggle('on', +el.dataset.i === cur));
    wk.querySelector('.sel-band').style.transform = `translateX(${G.padL + cur * band}px)`;
    // 选中周的标签：本周显示「进行中」（奶蛙黄 = 当前）
    const live = cur === LAST;
    pill.className = `wk-pill${live ? ' is-live' : ''}`;
    pill.innerHTML = live ? '<i class="live-dot"></i>进行中' : K.week.short(cur);
    const pw = pill.offsetWidth || 44;
    const px = K.clamp(cx(cur) - pw / 2, G.padL - 4, w - pw);
    pill.style.transform = `translate(${px}px, ${h - 22}px)`;
    wk.querySelectorAll('.mo').forEach((t) => { const x = +t.getAttribute('x'); t.style.opacity = x > px - 24 && x < px + pw + 24 ? 0 : 1; });
    // 本周旗标：选别的周时提示「进行中」在哪一列；离得太近时只留圆点
    const fx = cx(LAST);
    const near = Math.abs(cur - LAST) * band < 52;
    flag.classList.toggle('is-dot', near);
    flag.style.opacity = live ? 0 : 1;
    const fw = near ? 17 : 52;
    flag.style.transform = `translate(${Math.min(fx - fw / 2, w - fw)}px, ${Math.min(G.yM(NW.weeks[LAST].merged), G.baseM - 2) - 24}px)`;
    const wd = NW.weeks[cur];
    wk.setAttribute('aria-valuenow', String(cur + 1));
    wk.setAttribute('aria-valuetext', `${K.week.range(cur)}${live ? '，进行中' : ''}：合入 ${wd.merged} 个，活跃 ${wd.active} 人`);
  }
  // 小蛙蹲在选中柱顶；切周时沿抛物线跳过去
  let frogAt = null;
  function frogXY(i, x) {
    const cx = x ?? G.cx(i);
    const v = NW.weeks[i].merged;
    const y = v > 0 ? Math.min(G.yM(v), G.baseM - 2) : G.baseM - 2;
    return [cx - G.frog / 2, y - G.frog + 2];
  }
  function placeFrog(i, hop, x) {
    if (!G) return;
    const [x1, y1] = frogXY(i, x);
    const to = `translate(${x1}px, ${y1}px)`;
    frogEl.getAnimations().forEach((a) => a.cancel());
    if (!hop || !frogAt || K.reduced()) { frogEl.style.transform = to; frogAt = [x1, y1]; return; }
    const [x0, y0] = frogAt;
    const dist = Math.abs(x1 - x0);
    const peak = Math.min(y0, y1) - 14 - Math.min(26, dist * 0.08);
    const frames = [{ transform: `translate(${x0}px, ${y0}px) scale(1, 1)`, offset: 0 }, { transform: `translate(${x0}px, ${y0}px) scale(1.14, .84)`, offset: 0.1 }];
    for (let k = 0; k <= 14; k++) {
      const t = k / 14;
      const yy = y0 + (y1 - y0) * t - 4 * (Math.min(y0, y1) - peak) * t * (1 - t);
      frames.push({ transform: `translate(${x0 + (x1 - x0) * t}px, ${yy}px) scale(${k < 7 ? 0.94 : 1}, ${k < 7 ? 1.08 : 1})`, offset: 0.12 + t * 0.76 });
    }
    frames.push({ transform: `translate(${x1}px, ${y1}px) scale(1.14, .86)`, offset: 0.93 }, { transform: `translate(${x1}px, ${y1}px) scale(1, 1)`, offset: 1 });
    frogEl.style.transform = to;
    frogEl.animate(frames, { duration: K.clamp(380 + dist * 0.45, 420, 720), easing: 'linear' });
    frogAt = [x1, y1];
  }
  function wkTip(i) {
    const wd = NW.weeks[i], f = facts(i);
    const r = wk.getBoundingClientRect();
    const y = r.top + Math.min(G.yM(wd.merged), G.baseM - 2) - (i === cur ? G.frog + 4 : 6);
    const html = `<div class="t-h">${esc(K.week.range(i))}${i === LAST ? ' · 进行中' : ''}</div>`
      + `<div class="t-row"><span class="t-key box" style="--k:var(--leaf)"></span><span class="t-v">${fmt.int(wd.merged)}</span><span class="t-l">合入 PR</span></div>`
      + `<div class="t-row"><span class="t-key box" style="--k:var(--water)"></span><span class="t-v">${wd.active}</span><span class="t-l">活跃贡献者</span></div>`
      + `<div class="t-row"><span class="t-key" style="--k:var(--tip-ink-2)"></span><span class="t-v">${f.s.top.length}</span><span class="t-l">人获得魔力，共 ${mag(f.magic)}</span></div>`
      + (i === cur ? '' : '<div class="t-l" style="margin-top:4px">点击切到这一周</div>');
    K.tip.show(html, { getBoundingClientRect: () => ({ left: r.left + G.cx(i) - 1, width: 2, top: y - 2, bottom: y, height: 2 }) });
  }
  const colAt = (clientX) => K.clamp(Math.floor((clientX - wk.getBoundingClientRect().left - G.padL) / G.band), 0, G.n - 1);
  let dragging = false, hoverI = -1, downX = 0;
  wk.addEventListener('pointermove', (e) => {
    if (!G) return;
    const i = colAt(e.clientX);
    if (dragging) {
      const r = wk.getBoundingClientRect();
      if (Math.abs(e.clientX - downX) > 3) wk.classList.add('is-drag');
      if (i !== cur) setWeek(i, { hop: false, quiet: true });

    }

      const hb = wk.querySelector('.hov-band');

    }
  });

    $('#peopleEyebrow').textContent = f.live ? `本周 · ${K.week.range(i)}` : `${K.week.name(i)} · ${K.week.range(i)}`;
    const note = i === LAST ? K.week.note(i) : i === 0 ? '这是有记录的第一周，没有可对比的前一周。' : `「较前一周」对比的是 ${K.week.short(i - 1)} 那一周全周。`;
    $('#heroNote').innerHTML = `${icon('info', 13)}<span>${note}活跃 = 提 PR、合入或协作的人；魔力每人每周最多按 10 个动作计分。</span>`;
    if (!first) K.week.toURL(i);
    if (first) renderPanels(false, false);
    else if (quiet) settle();
    else { clearTimeout(settleT); renderPanels(true, true); }
    // 创纪录的周：从荧光笔处撒一小把花（只在用户主动切到这一周时）
    if (!first && !dragging && (f.recA || f.recM) && !K.reduced()) {
      setTimeout(() => { const m = h.querySelector('mark'); if (m) { const r = m.getBoundingClientRect(); if (r.bottom > 0 && r.top < innerHeight) K.confetti(r.left + r.width / 2, r.top + r.height / 2, { count: 22, power: 0.7 }); } }, 420);
    }
  }

  buildWk();
  setWeek(K.week.fromURL(), { first: true });
  if (!K.reduced()) {
    const [x, y] = frogXY(cur);
    frogEl.animate([{ transform: `translate(${x}px, ${y - 48}px) scale(.9, 1.1)`, opacity: 0 }, { transform: `translate(${x}px, ${y}px) scale(1.15, .85)`, opacity: 1, offset: 0.7 }, { transform: `translate(${x}px, ${y}px) scale(1, 1)`, opacity: 1 }], { duration: 640, delay: 240, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'backwards' });
  }
  let rw = wk.clientWidth;
  new ResizeObserver(() => { if (Math.abs(wk.clientWidth - rw) > 1) { rw = wk.clientWidth; buildWk(); } }).observe(wk);

  K.keys.add([
    { key: 'ArrowLeft', label: '前一周', group: '本周快照', handler: () => setWeek(cur - 1) },
    { key: 'ArrowRight', label: '后一周', group: '本周快照', handler: () => setWeek(cur + 1) },
    { key: 't', display: 'T', label: '回到本周', group: '本周快照', handler: () => setWeek(LAST) },
  ]);
  K.cmdk.add({ label: '回到本周', icon: 'rotate-ccw', run: () => setWeek(LAST), kbd: 'T' });
  K.cmdk.add({ label: `跳到合入最多的一周（${K.week.short(NW.weeks.reduce((b, w, i) => (w.merged > NW.weeks[b].merged ? i : b), 0))}）`, icon: 'git-merge', run: () => setWeek(NW.weeks.reduce((b, w, i) => (w.merged > NW.weeks[b].merged ? i : b), 0)) });
})();
</script>
</body>
</html>
