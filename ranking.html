<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排行榜 · 奶蛙宇宙</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/tokens.css">
<!-- 读取 data/board.json 后加载 engine.js、assets/derive.js、icons.js、kit.js，再执行下方 type="text/x-nw-page" 的页面脚本 -->
<script src="assets/boot.js"></script>
<style>
  /* ── 本页布局；颜色、字号、圆角、时长一律用令牌 ── */
  .intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-8); align-items: end; margin: var(--s-2) 0 var(--s-8); }
  .intro .headline { margin-top: var(--s-3); max-width: 22em; }
  .intro .lede { max-width: 44em; }
  .intro-stats { display: flex; gap: var(--s-6); padding-bottom: 6px; }
  .istat { min-width: 92px; }
  .istat .label { font-size: var(--fs-2xs); letter-spacing: .02em; }
  .istat b { display: block; margin-top: 4px; font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .istat small { display: block; margin-top: 2px; font-size: var(--fs-2xs); color: var(--ink-3); white-space: nowrap; }

  /* 排行榜 */
  .lb-bar { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5) var(--s-3); flex-wrap: wrap; }
  .lb-bar .search { width: 240px; margin-left: auto; }
  .lb-meta { display: flex; align-items: center; gap: 8px; padding: 0 var(--s-5) var(--s-3); font-size: var(--fs-xs); color: var(--ink-3); min-height: 18px; font-variant-numeric: tabular-nums; }
  .lb-meta b { color: var(--ink-2); font-weight: 650; }
  .lb-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-4); flex: none; }
  .lb-filters { padding: 0 var(--s-5) var(--s-4); gap: 5px; }
  .lb-filters .chip { padding: 0 8px; }
  .lb-filters .chip-sep { margin: 0 3px; }
  .chip[data-zero] { color: var(--ink-3); }
  .chip[data-zero] .n { opacity: .7; }
  .chip .ic { color: var(--ink-3); }
  .chip[aria-pressed="true"] .ic { color: currentColor; }
  .lb { --cols: 28px 46px minmax(170px, 1.35fr) 184px minmax(110px, 1fr) 78px 92px; }
  .lb .lrow { gap: 14px; }
  .lb .lrow-head span { white-space: nowrap; }
  .lb .c-delta { display: flex; justify-content: center; }
  .lb .fm { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; }
  .lb .fm .fn { display: flex; justify-content: space-between; gap: 6px; font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; color: var(--ink); }
  .lb .fm .fn span { font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .lb .fm .meter { margin-top: 5px; height: 4px; }
  .lb .c-val { text-align: right; justify-self: end; line-height: 1.25; }
  .lb .c-val .val { display: block; font-size: var(--fs-md); }
  .lb .c-val small { display: block; font-size: var(--fs-2xs); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lb .c-spark { justify-self: end; }
  .lb .c-spark .spark { cursor: crosshair; }
  .lb .spark .b.cur { fill: var(--leaf); opacity: .55; }
  .lb .spark .b.on { fill: var(--ink-2); }
  .lb .nm mark { background: var(--yolk-soft); color: var(--ink); border-radius: 3px; padding: 0 1px; box-shadow: inset 0 -1.5px 0 color-mix(in srgb, var(--yolk-deep) 70%, transparent); }
  .lb .rows:focus-visible { outline: none; }
  .lb .rows:focus-visible .lrow[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--focus); }
  .lb-foot { display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap; padding: 12px var(--s-5); border-top: 1px solid var(--line-soft); background: var(--surface-2); border-radius: 0 0 var(--r-xl) var(--r-xl); }
  .lb-foot .legend { margin-left: auto; color: var(--ink-3); }
  .lb-foot .lg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .lb-empty { padding: var(--s-6) var(--s-5) var(--s-8); }
  .warn-lines { display: inline-grid; grid-template-columns: repeat(4, auto); gap: 4px 14px; margin-top: 10px; font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .warn-lines b { color: var(--ink); font-weight: 650; }
  @media (max-width: 1100px) {
    .lb { --cols: 28px 46px minmax(150px, 1.3fr) 176px 78px 92px; }
    .lb .c-comp { display: none; }
    .intro { grid-template-columns: 1fr; gap: var(--s-5); }
  }

  /* 时光机 */
  .tm-head { display: flex; align-items: flex-start; gap: var(--s-4); padding: var(--s-5) var(--s-6) 0; flex-wrap: wrap; }
  .tm-head h2 { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 680; letter-spacing: -0.01em; margin-top: 6px; }
  .tm-head p { margin-top: 4px; font-size: var(--fs-sm); color: var(--ink-3); max-width: 46em; }
  .tm-body { display: grid; grid-template-columns: minmax(0, 1fr) 272px; gap: var(--s-6); padding: var(--s-4) var(--s-6) var(--s-5); }
  .tm-ctrl { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-6); }
  .tm-play { width: 40px; height: 40px; border-radius: 50%; padding: 0; justify-content: center; flex: none; }
  .tm-when { min-width: 168px; }
  .tm-when .range { display: block; font-size: var(--fs-md); font-weight: 680; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tm-when small { display: block; margin-top: 1px; font-size: var(--fs-2xs); color: var(--ink-3); white-space: nowrap; }
  .tm-scrub-wrap { flex: 1; min-width: 0; padding-top: 2px; }
  .tm-scrub { position: relative; height: 34px; touch-action: none; cursor: pointer; border-radius: var(--r-sm); outline: none; }
  .tm-scrub:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--focus); }
  .tm-scrub .c { position: absolute; bottom: 0; border-radius: 2px 2px 0 0; background: var(--viz-dim-2); transition: background-color var(--dur-2); }
  .tm-scrub .c.z { height: 1.5px !important; background: var(--viz-muted); border-radius: 1px; }
  .tm-scrub .c.on { background: var(--water); }
  .tm-scrub .c.z.on { background: var(--water); }
  .tm-thumb { position: absolute; top: -4px; bottom: -4px; left: 0; width: 0; pointer-events: none; will-change: transform; }
  .tm-thumb::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; border-radius: 1px; background: var(--ink); }
  .tm-thumb::after { content: ""; position: absolute; bottom: -6px; left: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink), var(--sh-2); transition: transform var(--dur-2) var(--ease-spring); }
  .tm-scrub.drag .tm-thumb::after { transform: scale(1.18); }
  .tm-months { position: relative; height: 14px; margin-top: 8px; }
  .tm-months span { position: absolute; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tm-speed { flex: none; }
  .tm-legend { align-self: flex-end; padding-bottom: 2px; }

  .tm-stage { --rh: 34px; --n: 12; --lab: 168px; --endw: 92px; position: relative; isolation: isolate; height: calc(var(--n) * var(--rh) + 26px); overflow: hidden; }
  .tm-axis { position: absolute; left: calc(28px + var(--lab)); right: 0; top: 0; bottom: 0; pointer-events: none; }
  .tm-axis .g { position: absolute; top: 18px; bottom: 0; width: 1px; background: var(--viz-grid); }
  .tm-axis .g.b { background: var(--viz-axis); }
  .tm-axis .g span { position: absolute; top: -17px; left: 0; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tm-axis .g.b span { transform: none; }
  .tm-water { position: absolute; right: 4px; bottom: 6px; text-align: right; pointer-events: none; font-family: var(--font-display); font-weight: 720; letter-spacing: -0.03em; line-height: 1; color: var(--ink-4); opacity: .55; }
  .tm-water b { display: block; font-size: 40px; font-variant-numeric: tabular-nums; }
  .tm-water small { display: block; margin-top: 6px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0; color: var(--ink-3); opacity: .9; }
  .tm-rk, .tm-nm { align-self: stretch; display: flex; align-items: center; background: var(--surface); }
  .tm-rk { justify-content: flex-end; }
  .tm-row { position: absolute; left: 0; right: 0; top: 24px; height: var(--rh); display: grid; grid-template-columns: 28px var(--lab) minmax(0, 1fr); align-items: center; will-change: transform, opacity; }
  .tm-rk { text-align: right; padding-right: 10px; font-size: var(--fs-sm); font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tm-rk.top { color: var(--yolk-ink); }
  .tm-nm { display: flex; align-items: center; gap: 6px; min-width: 0; padding-right: 10px; font-size: var(--fs-sm); font-weight: 560; color: var(--ink); cursor: pointer; }
  .tm-nm .ellipsis { flex: 1; }
  .tm-nm:hover .ellipsis { color: var(--leaf-ink); }
  .tm-track { position: relative; height: 100%; }
  .tm-bar { position: absolute; left: 0; top: 7px; bottom: 7px; background: var(--leaf); border-radius: 0 4px 4px 0; transition: opacity var(--dur-2), background-color var(--dur-3); }
  .tm-bar.idle { background: var(--viz-dim); }
  .tm-bar.zero { width: 1.5px !important; background: var(--viz-muted); }
  .tm-end { position: absolute; left: 0; top: 50%; display: flex; align-items: center; gap: 6px; padding-right: 6px; border-radius: var(--r-pill); background: var(--surface); white-space: nowrap; will-change: transform; }
  .tm-end .av { box-shadow: 0 0 0 2px var(--surface); }
  .tm-end .v { font-size: var(--fs-xs); font-weight: 680; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tm-end .pop { display: inline-flex; }
  .tm-end.in .pop { position: absolute; right: calc(100% + 4px); top: 50%; transform: translateY(-50%); }
  .tm-pop.tag { height: 20px; gap: 4px; padding: 0 7px 0 3px; white-space: nowrap; box-shadow: 0 0 0 2px var(--surface); animation: tm-pop 1800ms var(--ease-out) both; }
  @keyframes tm-pop { 0% { opacity: 0; transform: translateX(-6px) scale(.6); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-3px); } }
  .tm-row.up .tm-bar { background: var(--yolk-deep); }
  /* 被超过的行：文字先隐去、柱子压暗，从超车行底下滑过，不会出现半截名字或数字 */
  .tm-rk, .tm-nm, .tm-end { transition: opacity var(--dur-2) var(--ease-out); }
  .tm-row.sink { z-index: 0 !important; }
  .tm-row.sink .tm-rk, .tm-row.sink .tm-nm, .tm-row.sink .tm-end { opacity: 0; transition-duration: 60ms; }
  .tm-row.sink .tm-bar { opacity: .3; }
  .tm-stage.hov .tm-row:not(.hl) .tm-bar { opacity: .35; }
  .tm-stage.hov .tm-row:not(.hl) .tm-end { opacity: .5; }
  .tm-few { position: absolute; left: calc(40px + var(--lab)); top: 24px; font-size: var(--fs-xs); color: var(--ink-3); pointer-events: none; transition: opacity var(--dur-3); }

  .tm-side { display: flex; flex-direction: column; gap: var(--s-4); padding-left: var(--s-6); border-left: 1px solid var(--line-soft); min-width: 0; }
  .tm-side .dateline { min-height: 24px; }
  .tm-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tm-fact .label { font-size: var(--fs-2xs); }
  .tm-fact b { display: block; margin-top: 2px; font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tm-list { display: flex; flex-direction: column; gap: 8px; }
  .tm-list .it { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: var(--fs-sm); }
  .tm-list .it .k { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
  .tm-list .it .who { font-size: var(--fs-sm); }
  .tm-ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .tm-ev .tag { flex: none; }
  .tm-ev .ek { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
  .tm-side h4 { font-size: var(--fs-xs); font-weight: 650; color: var(--ink-3); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .tm-side .none { font-size: var(--fs-xs); color: var(--ink-3); }

  /* 公式 */
  .fx-main { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); font-size: var(--fs-md); color: var(--ink-2); }
  .fx-main .lhs { font-weight: 700; color: var(--ink); }
  .fx-main .sig { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
  .fx-main .sig b { font-size: 20px; font-weight: 500; color: var(--ink); }
  .fx-main .sig small { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
  .fx-main .par { font-size: 20px; font-weight: 300; color: var(--ink-3); line-height: 1; }
  .fx-main .tm { padding: 2px 8px; border-radius: var(--r-sm); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fx-grid { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: var(--s-6); margin-top: var(--s-5); }
  .fx-ctl + .fx-ctl { margin-top: var(--s-4); }
  .fx-ctl .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600; }
  .fx-ctl .hd b { font-weight: 680; color: var(--ink); font-variant-numeric: tabular-nums; }
  .fx-ctl .hd small { font-weight: 500; color: var(--ink-3); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
  .rng { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; --p: 50%; }
  .rng:focus { outline: none; }
  .rng::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--leaf) 0 var(--p), var(--bg-sunken) var(--p) 100%); box-shadow: inset 0 0 0 1px var(--line-soft); }
  .rng::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--leaf) 0 var(--p), var(--bg-sunken) var(--p) 100%); }
  .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--leaf), var(--sh-2); transition: transform var(--dur-2) var(--ease-spring); }
  .rng::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--leaf), var(--sh-2); }
  .rng:active::-webkit-slider-thumb { transform: scale(1.15); }
  .rng:focus-visible::-webkit-slider-thumb { box-shadow: inset 0 0 0 2px var(--leaf), 0 0 0 3px var(--surface), 0 0 0 5px var(--focus); }
  .rng-ticks { position: relative; height: 14px; margin-top: 2px; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rng-ticks span { position: absolute; top: 0; left: calc(9px + var(--x) * (100% - 18px)); transform: translateX(-50%); white-space: nowrap; }
  .rng-ticks span:first-child { transform: translateX(-9px); }
  .rng-ticks span:last-child { transform: translateX(calc(-100% + 9px)); }
  .fx-models { display: flex; flex-wrap: wrap; gap: 6px; }
  .fx-models .chip b { font-weight: 650; font-variant-numeric: tabular-nums; }
  .fx-models .chip.neg b { color: var(--rust); }
  .fx-out { display: flex; flex-direction: column; justify-content: space-between; gap: var(--s-4); padding: var(--s-4); border-radius: var(--r-lg); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); }
  .fx-out .label { font-size: var(--fs-xs); }
  .fx-big { font-family: var(--font-display); font-size: var(--fs-5xl); font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .fx-big small { margin-left: 4px; font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0; color: var(--ink-3); }
  .fx-eq { font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.6; font-variant-numeric: tabular-nums; }
  .fx-eq b { color: var(--ink-2); font-weight: 650; }
  .fx-bars { display: grid; gap: 6px; }
  .fx-b { display: grid; grid-template-columns: 52px minmax(0, 1fr) 36px; align-items: center; gap: 8px; font-size: var(--fs-2xs); color: var(--ink-3); }
  .fx-b .tr { position: relative; height: 10px; background: linear-gradient(90deg, var(--viz-grid) 1px, transparent 1px) 0 0 / 25% 100%; }
  .fx-b .tr i { position: absolute; top: 0; bottom: 0; border-radius: 0 3px 3px 0; background: var(--series-pr); transition: transform var(--dur-3) var(--ease-out), left var(--dur-3) var(--ease-out), width var(--dur-3) var(--ease-out); }
  .fx-b .tr i.m { background: var(--series-model); }
  .fx-b .tr i.m.neg { background: repeating-linear-gradient(135deg, var(--rust) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--rust); }
  .fx-b span:last-child { text-align: right; color: var(--ink-2); font-weight: 650; font-variant-numeric: tabular-nums; }
  .fx-week { margin-top: var(--s-5); padding-top: var(--s-5); border-top: 1px solid var(--line-soft); }
  .fx-blocks { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0 8px; min-height: 14px; }
  .fx-blocks i { width: 14px; height: 14px; border-radius: 3px; background: var(--leaf); transition: background-color var(--dur-2), transform var(--dur-3) var(--ease-spring); }
  .fx-week p { font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.6; font-variant-numeric: tabular-nums; }
  .fx-week p b { color: var(--ink); font-weight: 650; }

  /* 名词解释 */
  .gl-sec + .gl-sec { margin-top: var(--s-5); padding-top: var(--s-5); border-top: 1px solid var(--line-soft); }
  .gl-sec > .label { margin-bottom: 10px; font-size: var(--fs-2xs); letter-spacing: .04em; }
  .gl-ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .gl-step { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: var(--r-md); text-align: center; }
  .gl-step .fr { display: flex; align-items: flex-end; justify-content: center; height: 40px; }
  .gl-step b { font-size: var(--fs-xs); font-weight: 650; color: var(--ink); white-space: nowrap; }
  .gl-step small { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gl-step .n { font-size: 10.5px; font-weight: 650; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .gl-dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 12px; font-size: var(--fs-sm); line-height: 1.6; }
  .gl-dl dt { font-weight: 650; color: var(--ink); white-space: nowrap; }
  .gl-dl dt .tag { margin-top: 1px; }
  .gl-dl dd { color: var(--ink-2); }
  .gl-dl dd .muted { font-size: var(--fs-xs); }
  .gl-warn { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .gl-warn div { padding: 6px 8px; border-radius: var(--r-md); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .gl-warn b { display: block; font-size: var(--fs-sm); font-weight: 680; color: var(--ink); }
  .gl-warn .meter { margin-top: 5px; height: 3px; }
  .gl-warn .meter > i { background: var(--ink-3); }

  @media (max-width: 1100px) {
    .tm-body { grid-template-columns: 1fr; }
    .tm-side { padding-left: 0; border-left: 0; border-top: 1px solid var(--line-soft); padding-top: var(--s-4); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-5) var(--s-8); }
    .tm-side > .tm-facts-wrap { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .intro { margin-bottom: var(--s-6); }
    .intro-stats { gap: 0; justify-content: space-between; padding-top: var(--s-4); border-top: 1px solid var(--line-soft); }
    .istat b { font-size: var(--fs-xl); }
    .lb-bar { padding: var(--s-4) var(--s-4) var(--s-3); gap: 10px; }
    .lb-bar .card-title { flex: 1; }
    .lb-bar .seg-wrap { order: 3; width: 100%; }
    .lb-bar .seg-wrap .seg { display: flex; width: 100%; }
    .lb-bar .seg-wrap .seg button { flex: 1; justify-content: center; }
    .lb-bar .search { order: 4; width: 100%; margin-left: 0; }
    .lb-meta { padding: 0 var(--s-4) 10px; flex-wrap: wrap; }
    .lb-filters { flex-wrap: nowrap; overflow-x: auto; padding: 0 var(--s-4) var(--s-3); scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, black calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, black calc(100% - 28px), transparent); }
    .lb-filters::-webkit-scrollbar { display: none; }
    .lb-filters .chip { flex: none; }
    .lb .lrow-head { padding-top: 8px; padding-bottom: 8px; row-gap: 2px; }
    .lb .lrow-head .c-delta { display: none; }
    .lb .lrow { grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-areas: "rk who val" "dl fm sp"; row-gap: 6px; column-gap: 10px; padding: 10px var(--s-4); }
    .lb .c-rank { grid-area: rk; }
    .lb .c-delta { grid-area: dl; justify-content: flex-end; }
    .lb .c-who { grid-area: who; }
    .lb .c-form { grid-area: fm; padding-left: 36px; }
    .lb .c-val { grid-area: val; }
    .lb .c-spark { grid-area: sp; align-self: center; }
    .lb .c-comp { display: none; }
    .lb .rank { width: 30px; }
    .lb .fm { grid-template-columns: auto minmax(0, 1fr); }
    .lb-foot { padding: 12px var(--s-4); }
    .lb-foot .legend { margin-left: 0; }
    .tm-head { padding: var(--s-4) var(--s-4) 0; }
    .tm-ctrl { flex-wrap: wrap; padding: 0 var(--s-4); row-gap: var(--s-3); }
    .tm-scrub-wrap { order: 3; flex-basis: 100%; }
    .tm-speed { margin-left: auto; }
    .tm-body { padding: var(--s-3) var(--s-4) var(--s-4); }
    .tm-stage { --rh: 30px; --n: 10; --lab: 104px; --endw: 74px; }
    .tm-nm { font-size: var(--fs-xs); }
    .tm-nm .frog { display: none; }
    .tm-pop .t { display: none; }
    .tm-pop.tag { padding: 0 2px; }
    .tm-water { display: none; }
    .tm-legend { flex-basis: 100%; align-self: auto; }
    .tm-head > div:first-child { flex-basis: 100%; }
    .tm-side { grid-template-columns: 1fr; }
    .fx-grid { grid-template-columns: 1fr; }
    .fx-week .hd { flex-direction: column; align-items: flex-start; gap: 2px; }
    .gl-warn { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tm-side .tm-facts-wrap .dateline { flex-wrap: wrap; }
    .gl-dl { grid-template-columns: 1fr; gap: 2px; }
    .gl-dl dd { margin-bottom: 10px; }
  }
</style>
</head>
<body>
<header id="appbar"></header>

<main class="page">
  <section class="intro">
    <div>
      <span class="eyebrow">${trophy}排行榜</span>
      <h1 class="headline" id="headline"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="intro-stats" id="introStats"></div>
  </section>

  <section class="section">
    <div class="card card-flush" id="lbCard">
      <div class="lb-bar">
        <div class="card-title">贡献度排行</div>
        <div class="seg-wrap"><div id="winSeg" aria-label="时间窗"></div></div>
        <label class="search">${search}<input id="q" type="text" placeholder="搜索账号" aria-label="搜索账号" autocomplete="off" spellcheck="false" data-focus-fallback><kbd class="only-kbd">/</kbd></label>
      </div>
      <div class="lb-meta" id="lbMeta" aria-live="polite"></div>
      <div class="lb-filters chips" id="chips" role="group" aria-label="筛选"></div>
      <!-- 我的名次：列表之外的摘要，不占名次、不计入人数 -->
      <div class="me-strip me-sum" id="meSum" aria-live="polite"></div>
      <div class="lb">
        <div class="lrow lrow-head" role="presentation">
          <span class="r c-rank">#</span>
          <span class="c-delta">变化</span>
          <span class="c-who">贡献者</span>
          <span class="c-form"><span>形态 · 到下一级</span></span>
          <span class="c-comp" id="hComp">魔力构成</span>
          <span class="r c-val" id="hVal">魔力</span>
          <span class="r c-spark">近 12 周</span>
        </div>
        <div class="rows" id="rows" role="listbox" tabindex="0" aria-label="排行榜，↑↓ 选择，回车打开档案"></div>
      </div>
      <div class="lb-foot" id="lbFoot"></div>
    </div>
  </section>

  <section class="section">
    <div class="card card-flush" id="tmCard">
      <div class="tm-head">
        <div style="flex:1;min-width:0">
          <span class="eyebrow">${clock}时光机</span>
          <h2>排名是怎么变成今天这样的</h2>
          <p id="tmLede"></p>
        </div>
        <div class="legend tm-legend" aria-label="图例"><span class="key" style="--k:var(--leaf)">这一周拿到魔力</span><span class="key" style="--k:var(--viz-dim)">这一周没有新魔力</span></div>
      </div>
      <div class="tm-ctrl" style="margin-top:var(--s-4)">
        <button type="button" class="btn btn-primary tm-play" id="tmPlay" aria-label="播放">${play}</button>
        <div class="tm-when" aria-live="off"><span class="range" id="tmRange"></span><small id="tmSub"></small></div>
        <div class="tm-scrub-wrap">
          <div class="tm-scrub" id="tmScrub" role="slider" tabindex="0" aria-label="回放到哪一周" aria-valuemin="0"></div>
          <div class="tm-months" id="tmMonths" aria-hidden="true"></div>
        </div>
        <div class="tm-speed" id="tmSpeed" aria-label="回放速度"></div>
      </div>
      <div class="tm-body">
        <div class="tm-stage" id="tmStage" aria-label="累计魔力排名回放" role="img">
          <div class="tm-axis" id="tmAxis"></div>
          <div class="tm-water" id="tmWater" aria-hidden="true"></div>
          <div class="tm-few" id="tmFew"></div>
        </div>
        <aside class="tm-side" id="tmSide" aria-live="polite"></aside>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="grid stretch">
      <div class="card card-pad span-7" id="fxCard">
        <div class="card-head"><div><div class="card-title"><span class="card-icon leaf">${zap}</span>贡献度公式</div><div class="card-sub" style="margin-left:36px">贡献度 = 魔力，按魔力降序排名。魔力只增不减。</div></div></div>
        <div class="fx-main" id="fxMain"></div>
        <div class="fx-grid">
          <div>
            <div class="fx-ctl"><div class="hd"><span>改动行数</span><b id="fxLinesV"></b></div><input class="rng" id="fxLines" type="range" min="0" max="1000" step="1" aria-label="改动行数"><div class="rng-ticks" id="fxLinesTicks"></div></div>
            <div class="fx-ctl"><div class="hd"><span>commit 数</span><b id="fxCommitsV"></b></div><input class="rng" id="fxCommits" type="range" min="1" max="40" step="1" aria-label="commit 数"><div class="rng-ticks" id="fxCommitsTicks"></div></div>
            <div class="fx-ctl"><div class="hd"><span>署名的模型</span><small id="fxModelNote"></small></div><div class="fx-models" id="fxModels" role="radiogroup" aria-label="署名的模型"></div></div>
          </div>
          <div class="fx-out" aria-live="polite">
            <div><div class="label">这个 PR 原始分</div><div class="fx-big"><span id="fxScore" class="num"></span><small>分</small></div></div>
            <div class="fx-bars" id="fxBars"></div>
            <div class="fx-eq" id="fxEq"></div>
            <div class="fx-eq" id="fxRef" style="padding-top:10px;border-top:1px solid var(--line-soft)"></div>
          </div>
        </div>
        <div class="fx-week">
          <div class="fx-ctl"><div class="hd"><span>如果这周合入 <b id="fxNV"></b> 个这样的 PR</span><small id="fxCapNote"></small></div><input class="rng" id="fxN" type="range" min="1" max="24" step="1" aria-label="这周合入几个这样的 PR"></div>
          <div class="fx-blocks" id="fxBlocks" aria-hidden="true"></div>
          <p id="fxWeek"></p>
        </div>
      </div>
      <div class="card card-pad span-5" id="glCard">
        <div class="card-head"><div class="card-title"><span class="card-icon water">${book}</span>名词解释</div></div>
        <div id="gloss"></div>
      </div>
    </div>
  </section>
</main>

<script type="text/x-nw-page">
(function () {
  const K = NWK, N = NW, { esc, mag, fmt, icon } = K;
  const $ = (s, r = document) => r.querySelector(s);
  const W = N.W, LAST = N.last, PEOPLE = N.people;
  K.appHeader($('#appbar'), { active: 'c2' });
  // 模板里的 ${图标} 占位
  document.querySelectorAll('.eyebrow, .search, .card-title, .tm-play').forEach((el) => {
    el.innerHTML = el.innerHTML.replace(/\$\{(\w+)\}/g, (_, n) => icon({ trophy: 'trophy', search: 'search', clock: 'rotate-ccw', play: 'play', zap: 'zap', book: 'book-open' }[n], n === 'search' ? 15 : n === 'play' ? 18 : 14));
  });

  const sumW = (p, a, b) => { let s = 0; for (let k = a; k <= b; k++) if (k >= 0) s += p.wk.get(W[k]) || 0; return s; };
  const isNew = (p) => p.firstAt >= W[LAST]; // 首次贡献落在本周 = 新面孔
  const levelName = (p) => K.formOf(p).name;

  // ═════════════════ 引言：标题 + 导语（全部从数据算） ═════════════════
  (function intro() {
    const top = PEOPLE[0];
    const byL4 = PEOPLE.slice().sort((a, b) => b.l4 - a.l4 || a.login.localeCompare(b.login));
    const byTw = PEOPLE.slice().sort((a, b) => b.tw - a.tw || a.login.localeCompare(b.login));
    const l4Lead = byL4[0], twLead = byTw[0];
    const climb = PEOPLE.filter((p) => p.move > 0).sort((a, b) => b.move - a.move || a.rank - b.rank)[0];
    const fresh = PEOPLE.filter(isNew);
    const freshOut = fresh.filter((p) => !p.member).length;
    const n = (x) => `<span class="n">${x}</span>`;
    // 连续第一的周数：从本周往回数，排名一直是 1 的周
    let streak = 0;
    for (let i = LAST; i >= 0 && N.ranksAt(i).get(top.login) === 1; i--) streak++;
    const l4Second = byL4[1];
    $('#headline').innerHTML = l4Lead === top
      ? `${K.pname(top.login, { avatar: false })} <span class="nowrap">${streak >= 4 ? `连续 ${streak} 周第一，` : '排在第一，'}</span><span class="nowrap">近 4 周也<mark>拿得最多</mark></span>`
      : `<span class="nowrap">近 4 周，</span>${K.pname(l4Lead.login, { avatar: false })} <span class="nowrap"><mark>拿到的魔力最多</mark></span>`;
    $('#headline').classList.add('is-in');
    let s = `总榜第一是 ${K.pname(top.login)}，累计 ${n(mag(top.bonus))} 魔力`;
    if (l4Lead === top && l4Second) {
      s += `；近 4 周拿到 ${n(mag(top.l4))}，只比 ${K.pname(l4Second.login)} 多 ${mag(top.l4 - l4Second.l4)}`;
    } else if (l4Lead !== top) {
      const ratio = top.l4 > 0 ? l4Lead.l4 / top.l4 : null;
      s += `；近 4 周 ${K.pname(l4Lead.login)} 拿到 ${n(mag(l4Lead.l4))}${ratio ? `，是第一名同期的 ${(Math.round(ratio * 10) / 10).toFixed(1)} 倍` : ''}`;
    }
    s += `。本周${K.week.asOf()}，${twLead === l4Lead ? '还是 ' : ''}${K.pname(twLead.login)} 以 ${n(mag(twLead.tw))} 领跑`;
    if (climb) s += `，${K.pname(climb.login)} 在总榜上升最多（▲${climb.move} 到第 ${climb.rank}）`;
    s += '。';
    if (fresh.length) s += `另有 ${n(fresh.length)} 位新面孔第一次上榜${fresh.length === 1 ? (freshOut ? '，来自组织外' : '，是组织成员') : freshOut === fresh.length ? '，全部来自组织外' : freshOut ? `，其中 ${freshOut} 位来自组织外` : ''}。`;
    $('#lede').innerHTML = s;
    const twN = PEOPLE.filter((p) => p.tw > 0.005).length, l4N = PEOPLE.filter((p) => p.l4 > 0.005).length;
    $('#introStats').innerHTML = [
      ['总榜', fmt.int(PEOPLE.length), `组织成员 ${N.summary.members} · 组织外 ${N.summary.outsiders}`],
      ['本周有魔力', fmt.int(twN), K.week.range(LAST)],
      ['近 4 周有魔力', fmt.int(l4N), `${fmt.md(W[Math.max(0, LAST - 3)])}起`],
    ].map(([l, v, s2]) => `<div class="istat"><span class="label">${l}</span><b>${v}<span class="muted" style="font-size:var(--fs-sm);font-weight:600;margin-left:3px">人</span></b><small>${s2}</small></div>`).join('');
  })();

  // ═════════════════ 排行榜 ═════════════════
  const qs0 = new URLSearchParams(location.search);
  // ?flag=lag 等：从首页「查看全部」进来时直接带上筛选
  const st = { win: ['all', 'week', 'l4'].includes(qs0.get('win')) ? qs0.get('win') : 'all', mem: 'all', form: null, flags: new Set(qs0.getAll('flag').filter((f) => ['z', 'w', 'a', 'lag', 'watch'].includes(f))), q: '', sel: -1, all: false };
  const LIMIT = 20;
  const winName = { all: '总榜', week: '本周', l4: '近 4 周' };

  function windowRank(score, prevScore) {
    const ranked = PEOPLE.filter((p) => score(p) > 0.005).sort((a, b) => score(b) - score(a) || a.login.localeCompare(b.login));
    const prevMap = new Map(PEOPLE.filter((p) => prevScore(p) > 0.005).sort((a, b) => prevScore(b) - prevScore(a) || a.login.localeCompare(b.login)).map((p, k) => [p.login, k + 1]));
    return ranked.map((p, k) => ({ p, rank: k + 1, v: score(p), prank: prevMap.get(p.login), move: isNew(p) ? null : prevMap.has(p.login) ? prevMap.get(p.login) - (k + 1) : undefined }));
  }
  const cache = {};
  function windowRows(win) {
    if (cache[win]) return cache[win];
    let rows;
    if (win === 'all') rows = PEOPLE.map((p) => ({ p, rank: p.rank, v: p.bonus, prank: p.prank, move: p.move }));
    else if (win === 'week') rows = windowRank((p) => p.tw, (p) => p.lw);
    else rows = windowRank((p) => p.l4, (p) => sumW(p, LAST - 4, LAST - 1));
    return (cache[win] = rows);
  }

  // 筛选：三组，组内单选、组间相交。计数 = 其他组条件不变时这一项的人数
  const formKey = (p) => { const f = K.formOf(p); return f.egg ? 'egg' : f.unhatched ? 'unhatched' : `l${f.level}`; };
  const GROUPS = {
    mem: [['all', '全部'], ['m', '组织成员'], ['o', '组织外']],
    form: [...N.LV.map((L, k) => [`l${k}`, L.name, L.icon]), ['egg', '蛙卵', 'egg'], ['unhatched', '未孵化', 'unhatched']],
    flags: [['z', '冬眠', null, 'moon-z'], ['w', '合入率警告', null, 'alert-triangle'], ['a', '新手异常', null, 'zap'], ['lag', '掉队', null, 'trending-down'], ['watch', '观察', null, 'eye']],
  };
  const TERM = {
    m: '在数据更新时属于 nwverse 组织成员名单的账号。',
    o: '数据更新时不在组织成员名单里的账号，例如从 fork 提 PR 的外部贡献者、已退出的人。贡献照常计分。',
    z: `超过 ${N.RULES.dormantDays} 天没有任何动作。只做标记；${N.LV[N.RULES.dormantExemptLevel].name}及以上不标记。`,
    w: `已收尾 PR 超过 ${N.RULES.warnLines[0].resolved} 个后，合入率低于 ${fmt.pct(N.RULES.warnLines[0].rate)} 就会被标记，门槛随已收尾数提高。只提醒，不扣魔力。`,
    lag: `活力低于 ${N.RULES.vitality.laggard}：近期产出、持续度、历史信用、最近动作综合得分很低。只做提醒，不影响魔力与形态。`,
    watch: `活力在 ${N.RULES.vitality.laggard} 到 ${N.RULES.vitality.watch} 之间：贡献在变少，还没到掉队。`,
    a: `考核期内开了 ${N.RULES.newbie.anomaly.opened} 个以上 PR，合入的不到 ${fmt.pct(N.RULES.newbie.anomaly.rate)}。最近 ${N.RULES.newbie.anomaly.graceHours} 小时内开的 PR 不计。`,
    egg: `首次贡献起 ${N.RULES.newbie.days} 天内的考核期，还没孵化。${N.RULES.newbie.since ? '看板上线前来的、第一次没通过的，从上线日起补考一次。' : ''}`,
    unhatched: `考核期已过仍未达标；魔力攒到 ${N.RULES.hatchBonus} 也能直接孵化。`,
  };
  const formTip = (k) => {
    const L = N.LV[k], nx = N.LV[k + 1];
    return k === 0 ? `已孵化，魔力不到 ${fmt.int(nx.bonus)}` : nx ? `魔力 ${fmt.int(L.bonus)} 到 ${fmt.int(nx.bonus)}` : `魔力 ≥ ${fmt.int(L.bonus)}`;
  };
  const pass = (p, s) => (s.mem === 'all' || (s.mem === 'm') === !!p.member)
    && (!s.form || formKey(p) === s.form)
    && (!s.flags.has('z') || p.dormant) && (!s.flags.has('w') || p.warn) && (!s.flags.has('a') || p.newbie.anomaly) && (!s.flags.has('lag') || (p.vit && p.vit.status === 'laggard')) && (!s.flags.has('watch') || (p.vit && p.vit.status === 'watch'));
  const matchQ = (p) => !st.q || p.login.toLowerCase().includes(st.q);
  function filtered() { return windowRows(st.win).filter((r) => pass(r.p, st) && matchQ(r.p)); }

  function chipsHTML() {
    const base = windowRows(st.win).filter((r) => matchQ(r.p));
    const cnt = (over) => { const s = { ...st, flags: new Set(st.flags), ...over }; return base.filter((r) => pass(r.p, s)).length; };
    const chip = (grp, v, label, on, n, pre = '', tip = '') => `<button type="button" class="chip" data-g="${grp}" data-v="${v}" aria-pressed="${on}"${n === 0 && !on ? ' data-zero' : ''}${tip ? ` data-tip="${esc(tip)}"` : ''}><span class="chk">${icon('check', 13)}</span>${pre}${label}<span class="n">${n}</span></button>`;
    return GROUPS.mem.map(([v, l]) => chip('mem', v, l, st.mem === v, cnt({ mem: v }), '', TERM[v] || '')).join('')
      + '<span class="chip-sep"></span>'
      + GROUPS.form.map(([v, l, fr]) => chip('form', v, l, st.form === v, cnt({ form: v }), K.frog(fr, 18), TERM[v] || formTip(+v.slice(1)))).join('')
      + '<span class="chip-sep"></span>'
      + GROUPS.flags.map(([v, l, , ic]) => { const s = new Set(st.flags); s.add(v); return chip('flags', v, l, st.flags.has(v), cnt({ flags: s }), icon(ic, 13), TERM[v]); }).join('');
  }

  const hl = (login) => {
    if (!st.q) return esc(login);
    const k = login.toLowerCase().indexOf(st.q);
    if (k < 0) return esc(login);
    return `${esc(login.slice(0, k))}<mark>${esc(login.slice(k, k + st.q.length))}</mark>${esc(login.slice(k + st.q.length))}`;
  };
  function formCell(p) {
    const fo = K.formOf(p), nx = K.nextInfo(p);
    let tip;
    if (!fo.hatched) {
      const h = K.hatchHint(p);
      tip = `<div class='t-h'>${fo.name} · 魔力 ${mag(p.bonus)} / ${N.RULES.hatchBonus}</div><div class='t-l' style='white-space:normal;max-width:240px'>${esc(h ? h.text : '')}</div>`;
      return `<div class="fm" data-tip-html="${esc(tip)}">${K.frogOf(p, 22)}<div style="min-width:0"><div class="fn">${fo.name}<span>${mag(p.bonus)}/${N.RULES.hatchBonus}</span></div><div class="meter yolk"><i style="width:${(p.progress * 100).toFixed(1)}%"></i></div></div></div>`;
    }
    tip = nx
      ? `<div class='t-h'>${fo.name} → ${nx.name}（${fmt.int(N.LV[p.next.level].bonus)}）</div><div class='t-row'><span class='t-v'>${mag(nx.gap)}</span><span class='t-l'>还差</span></div><div class='t-row'><span class='t-v'>${mag(nx.pace)}</span><span class='t-l'>近 4 周周均 · ${K.etaText(nx.eta)}</span></div>`
      : `<div class='t-h'>${fo.name}</div><div class='t-l'>已到最高形态</div>`;
    return `<div class="fm" data-tip-html="${esc(tip)}">${K.frogOf(p, 22)}<div style="min-width:0"><div class="fn">${fo.name}<span>${nx ? `差 ${mag(nx.gap)}` : '最高'}</span></div><div class="meter"><i style="width:${(p.progress * 100).toFixed(1)}%"></i></div></div></div>`;
  }
  function deltaCell(r) {
    const base = st.win === 'all' ? '上周末' : st.win === 'week' ? '上周' : '上周时的近 4 周榜';

    function layoutScrub() {

      // 只有一周时没有间距可分：唯一的柱居中，拖动和点击都落在第 0 周

      cols.forEach((c, i) => { c.style.left = `${x0 + i * step}px`; c.style.width = `${bw}px`; c.style.height = `${Math.max(2, (maxWM > 0 ? weekMagic[i] / maxWM : 0) * 30)}px`; });
      scrub._x = (tt) => x0 + tt * step + bw / 2;
      scrub._t = (x) => (step ? K.clamp((x - bw / 2) / step, 0, LAST) : 0);
      let lastM = -1, lastX = -99;
      $('#tmMonths').innerHTML = W.map((w0, i) => {

    }

    function rowEl(p) {

      el._rk = el.querySelector('.tm-rk'); el._fr = el.querySelector('.fr'); el._bar = el.querySelector('.tm-bar'); el._end = el.querySelector('.tm-end'); el._v = el.querySelector('.v'); el._pop = el.querySelector('.pop');

    // 位置不按「周末名次」硬插值（交换的两行会在中点重叠）：每帧按插值后的魔力排序，

      }

        el.classList.toggle('sink', sinking);

        el.style.transform = `translate3d(0, ${(y * rh).toFixed(2)}px, 0)`;

        const w = Math.max(0, (v / xmax) * trackW);

        // 柱头右侧放不下提示时，提示改贴在柱头左侧（压在柱子上），不会被舞台边缘裁掉

      // 坐标轴

      for (let v = step; v <= xmax; v += step) g += `<div class="g" style="left:${((v / xmax) * trackW).toFixed(1)}px"><span>${fmt.int(v)}</span></div>`;

    }

    function setWeek(wk, prevWk) {

      $('#tmSub').textContent = wk === LAST ? `本周 · ${K.week.asOf()}` : wk === LAST - 1 ? '上周 · 已结束' : `第 ${wk + 1} / ${W.length} 周`;
      $('#tmWater').innerHTML = `<b>${fmt.week(W[wk])}</b><small>${wk === LAST ? '进行中' : `${fmt.int(s.contributors)} 位贡献者`}</small>`;

    function side(wk, s) {

      const facts = [['活跃', fmt.int(s.active), '人', '提 PR、合入或协作的人'], ['合入', fmt.int(s.merged), '个', '这一周合入的 PR'], ['有魔力', fmt.int(s.top.length), '人', '这一周拿到魔力的人；只开了 PR 的人算活跃，但没有魔力']];
      const el = $('#tmSide');

        + `<div class="tm-facts">${facts.map(([l, v, u, tip]) => `<div class="tm-fact" data-tip="${tip}" tabindex="0"><span class="label">${l}</span><b>${v}<span class="muted" style="font-size:var(--fs-xs);font-weight:600;margin-left:2px">${u}</span></b></div>`).join('')}</div></div>`
        + `<div><h4>${icon('flame', 13)}当周魔力最多</h4>${top.length ? `<div class="tm-list">${top.map((x, k) => `<div class="it"><span class="k">${k + 1}</span>${K.who(x.p, { size: 20 })}<span class="k" style="color:var(--ink)">${mag(x.v)}</span></div>`).join('')}</div>` : '<p class="none">这一周没有人拿到魔力。</p>'}</div>`
        + `<div><h4>${icon('sparkles', 13)}孵化与进化 <span class="muted" style="font-weight:500">${ev.length ? `${ev.length} 人` : ''}</span></h4>${ev.length ? `<div class="tm-list">${ev.slice(0, 4).map(([p, kind]) => `<div class="tm-ev">${K.who(p, { size: 20 })}<span class="ek">${kind}${K.levelBadge(p, { i: wk, size: 16 })}</span></div>`).join('')}${ev.length > 4 ? `<span class="none">还有 ${K.people(ev.slice(4).map(([p]) => p.login), { max: 2 })}</span>` : ''}</div>` : '<p class="none">这一周没有人孵化或进化。</p>'}</div>`;

    const durOf = (i) => (weekMagic[i + 1] < 0.05 && weekMagic[i] < 0.05 ? 260 : 1100) / speed;
    function frame(now) {

        const tick = () => { if (!playing) return; t = Math.min(LAST, Math.floor(t) + 1); draw(); if (t >= LAST) pause(); else raf = setTimeout(tick, 900 / speed); };

    btn.addEventListener('click', () => { if (playing) { pause(); seek(t, { snap: true }); } else play(); });
    let snapRaf = 0;
    function seek(to, { snap = false } = {}) {

    scrub.addEventListener('pointermove', (e) => {
      const x = e.clientX - scrub.getBoundingClientRect().left;
      if (drag) { seek(scrub._t(x)); return; }
      const i = Math.round(scrub._t(x));
      const s = N.weekSnapshot(i);
      K.tip.show(`<div class="t-h">${K.weekLabel(i)}${i === LAST ? ' · 进行中' : ''}</div><div class="t-row"><span class="t-key box" style="--k:var(--water)"></span><span class="t-v">${mag(weekMagic[i])}</span><span class="t-l">全组织产出魔力</span></div><div class="t-l">${fmt.int(s.active)} 人活跃 · 合入 ${fmt.int(s.merged)} 个 · 点击跳到这一周</div>`, cols[i]);

      const p = N.byLogin.get(h), wk = Math.round(t), fo = K.formOf(p, wk);
      K.tip.show(`<div class="t-h">${K.weekLabel(wk)} · 第 ${r._rkv} 名</div>`
        + `<div class="t-row"><span class="t-key box" style="--k:var(--leaf)"></span><span class="t-v">${mag(p.cum[wk])}</span><span class="t-l">${esc(p.login)} 累计魔力</span></div>`
        + `<div class="t-row"><span class="t-key box" style="--k:var(--viz-dim)"></span><span class="t-v">+${mag(p.wk.get(W[wk]) || 0)}</span><span class="t-l">当周 · ${fo.name}</span></div>`, e);
    });
    stage.addEventListener('pointerleave', () => { hover = null; stage.classList.remove('hov'); K.tip.hide(); draw(); });
    K.segmented($('#tmSpeed'), [{ value: '1', label: '1×' }, { value: '2', label: '2×' }], (v) => { speed = +v; }, { size: 'sm' });
    const stepKey = (d) => () => {
      const a = document.activeElement;
      if (a && a.closest && a.closest('[role="radiogroup"], [role="slider"], input, .rows')) return false; // 让控件自己处理方向键

    };
    K.keys.add([
      { key: 'p', display: 'P', label: '播放 / 暂停时光机', group: '时光机', handler: () => { if (playing) { pause(); seek(t, { snap: true }); } else play(); } },
      { key: 'ArrowLeft', display: '←', label: '时光机前一周', group: '时光机', handler: stepKey(-1) },
      { key: 'ArrowRight', display: '→', label: '时光机后一周', group: '时光机', handler: stepKey(1) },
    ]);

    const firstW = W.findIndex((_, i) => PEOPLE.some((p) => p.started[i]));
    const reach = PEOPLE.filter((p) => W.some((_, i) => p.started[i] && (N.ranksAt(i).get(p.login) || 99) <= 3)).length;
    $('#tmLede').innerHTML = `从 ${fmt.md(W[firstW])} 那一周到本周，${W.length} 周里共有 <b class="strong">${reach}</b> 人进过前 3。柱长是到那一周末的累计魔力，柱子变亮说明那一周有新魔力。<span class="only-kbd">按 <kbd>P</kbd> 播放，<kbd>←</kbd> <kbd>→</kbd> 逐周。</span>`;
    setBtn();
    layoutScrub();
    draw(true);
    return { play, pause };
  })();

  // ═════════════════ 公式：单个 PR 计算器 ═════════════════
  (function formula() {
    const S = N.RULES.score, CAPS = N.RULES.weeklyScoreCaps;
    const models = N.summary.models.slice().sort((a, b) => b.weight - a.weight || b.count - a.count);
    const topM = models[0];
    $('#fxMain').innerHTML = `<span class="lhs">魔力</span><span>=</span><span class="sig"><b>Σ</b><small>每周</small></span><span class="par">(</span>`
      + `<span class="tm" data-tip="P 是当周含模型加成的 PR 原始分">${CAPS.pr}P ÷ (${CAPS.pr} + P)</span><span>+</span>`
      + `<span class="tm" data-tip="C 是当周协作次数乘以每次协作分">${CAPS.collab}C ÷ (${CAPS.collab} + C)</span><span class="par">)</span>`;
    let m = models.findIndex((x) => x === topM);
    $('#fxModels').innerHTML = models.map((x, k) => `<button type="button" class="chip ${x.weight < 1 ? 'neg' : ''}" role="radio" data-k="${k}" aria-pressed="${k === m}" aria-checked="${k === m}" data-tip="组织里有 ${fmt.int(x.count)} 个合入 PR 是这个署名"><span class="chk">${icon('check', 13)}</span>${esc(x.label)} <b>×${x.weight}</b></button>`).join('');
    const L = $('#fxLines'), C = $('#fxCommits'), Nn = $('#fxN');
    const linesOf = (pos) => { const v = Math.pow(10, (pos / 1000) * 4) - 1; return v < 100 ? Math.round(v) : v < 1000 ? Math.round(v / 10) * 10 : Math.round(v / 100) * 100; };
    L.value = String(Math.round((Math.log10(301) / 4) * 1000)); C.value = '3'; Nn.value = '12';
    // 刻度按滑块真实位置摆放（行数是对数轴）
    $('#fxLinesTicks').innerHTML = [0, 10, 100, 1000, 10000].map((v) => `<span style="--x:${(Math.log10(1 + v) / 4).toFixed(4)}">${fmt.int(v)}</span>`).join('');
    $('#fxCommitsTicks').innerHTML = [1, 10, 20, 30, 40].map((v) => `<span style="--x:${((v - 1) / 39).toFixed(4)}">${v}</span>`).join('');
    const setP = (el) => el.style.setProperty('--p', `${((el.value - el.min) / (el.max - el.min)) * 100}%`);
    const MAXS = 4; // 条形图横轴上限
    function calc() {
      [L, C, Nn].forEach(setP);
      const lines = linesOf(+L.value), commits = +C.value, M = models[m];
      const a = S.lines * Math.log10(1 + lines), b = S.commits * Math.log2(1 + commits);
      const raw = 1 + a + b, score = raw * M.weight, dm = score - raw;
      $('#fxLinesV').textContent = `${fmt.int(lines)} 行`;
      $('#fxCommitsV').textContent = `${commits} 个`;
      $('#fxModelNote').textContent = `组织里出现过的 ${models.length} 种署名`;
      $('#fxScore').textContent = mag(score);
      $('#fxScore').setAttribute('aria-label', `${mag(score)} 魔力`);
      const x = (v) => `${(v / MAXS) * 100}%`;
      const bar = (lab, from, to, cls = '', tip = '') => `<div class="fx-b"${tip ? ` data-tip="${esc(tip)}"` : ''}><span>${lab}</span><span class="tr"><i class="${cls}" style="left:${x(Math.min(from, to))};width:${x(Math.abs(to - from))}"></i></span><span>${(to - from) < 0 ? '−' : '+'}${mag(Math.abs(to - from))}</span></div>`;
      $('#fxBars').innerHTML = bar('基础', 0, 1, '', '每个合入 PR 先得 1')
        + bar('改动行', 1, 1 + a, '', `${S.lines} × log₁₀(1 + ${lines})`)
        + bar('commit', 1 + a, raw, '', `${S.commits} × log₂(1 + ${commits})`)
        + bar('模型', raw, score, `m ${dm < 0 ? 'neg' : ''}`, `× ${M.weight}（${M.label}）${dm < 0 ? '，低于 1 时按扣分计' : ''}`);
      $('#fxEq').innerHTML = `原始 PR 分相当于 <b>${mag(score / S.collab)}</b> 次协作原始分。改动行和 commit 都按对数加分：行数翻 10 倍只多 ${S.lines}，commit 翻倍只多 ${S.commits}。`;
      const n = +Nn.value;
      const week = weeklyScore(n * raw, n * dm, 0, N.RULES);
      const wkScore = week.bonus;
      $('#fxNV').textContent = n;
      $('#fxCapNote').textContent = `PR 递减额度 ${CAPS.pr}；协作另有 ${CAPS.collab} 的递减额度`;
      $('#fxBlocks').innerHTML = Array.from({ length: n }, () => '<i></i>').join('');
      $('#fxWeek').innerHTML = `当周 PR 原始分 ${mag(n * score)}，按 ${CAPS.pr}P/(${CAPS.pr}+P) 得 <b>${mag(week.pr + week.model)}</b>；协作得 <b>${mag(week.collab)}</b>，合计 <b>${mag(wkScore)}</b>。PR 越多仍会增加得分，但单个新增 PR 的增量会变小。`;
    }
    const sPR = PEOPLE.reduce((a, p) => a + p.bonusPr + p.bonusModel, 0), sM = PEOPLE.reduce((a, p) => a + p.merged, 0);
    const avgPR = sPR / sM;
    $('#fxRef').innerHTML = `对照：组织里 ${fmt.int(sM)} 个合入 PR 平均每个累计折算 <b>${mag(avgPR)}</b> 魔力；PR 与协作分开递减，不会因另一项贡献增加而被稀释。`;
    [L, C, Nn].forEach((el) => el.addEventListener('input', calc));
    const chipsM = () => [...$('#fxModels').querySelectorAll('.chip')];
    const syncTab = () => chipsM().forEach((x, k) => x.tabIndex = k === m ? 0 : -1);
    $('#fxModels').addEventListener('keydown', (e) => {
      const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!d) return;
      e.preventDefault(); e.stopPropagation();
      const cs = chipsM(); cs[(m + d + cs.length) % cs.length].click(); cs[m].focus();
    });
    $('#fxModels').addEventListener('click', (e) => {
      const c = e.target.closest('.chip'); if (!c) return;
      m = +c.dataset.k;
      $('#fxModels').querySelectorAll('.chip').forEach((x) => { const on = x === c; x.setAttribute('aria-pressed', String(on)); x.setAttribute('aria-checked', String(on)); });
      syncTab(); calc();
    });
    syncTab(); calc();
  })();

  // ═════════════════ 名词解释 ═════════════════
  (function gloss() {
    const R = N.RULES, LC = N.summary.levelCounts;
    const ladder = N.LV.map((L, k) => `<div class="gl-step" data-tip="${esc(L.tagline)}"><span class="fr">${K.frog(L.icon, 30 + k * 2, LC[k] ? '' : 'ghost')}</span><b>${L.name}</b><small>${k ? `≥ ${fmt.int(L.bonus)}` : '孵化即得'}</small><span class="n">${LC[k] ? `${LC[k]} 人` : '虚位以待'}</span></div>`).join('');
    const wl = R.warnLines.map((x) => `<div><span>已收尾 &gt;${x.resolved}</span><b>${fmt.pct(x.rate)}</b><div class="meter sm"><i style="width:${x.rate * 100}%"></i></div></div>`).join('');
    $('#gloss').innerHTML = `
      <div class="gl-sec"><div class="label">形态 · 只看魔力，不降级</div><div class="gl-ladder">${ladder}</div>
        <p class="footnote" style="margin-top:10px">${icon('egg', 13)}<span>首次贡献起 ${R.newbie.days} 天内合入 ≥ ${R.newbie.merged} 且活跃周 ≥ ${R.newbie.activeWeeks} 即孵化，或魔力 ≥ ${R.hatchBonus} 直接孵化${R.newbie.since ? '；看板上线前来的、第一次没通过的，从上线日起补考一次' : ''}。考核期内叫<b class="strong">蛙卵</b>（${N.summary.pending} 人），期满未达标叫<b class="strong">未孵化</b>（${N.summary.failed} 人）。</span></p></div>
      <div class="gl-sec"><dl class="gl-dl">
        <dt>魔力</dt><dd>合入 PR 分（已乘模型系数）与协作分按周累计；当周 PR 原始分 P 按 ${R.weeklyScoreCaps.pr}P/(${R.weeklyScoreCaps.pr}+P) 递减，协作分 C 按 ${R.weeklyScoreCaps.collab}C/(${R.weeklyScoreCaps.collab}+C) 递减，两者分别计分。</dd>
        <dt>协作</dt><dd>参与别人的 PR 或 issue：review、评论、帮人合入。同一个只算一次；自己提的有效 issue 也算。每次贡献原始分 +${R.score.collab}，再按当周协作总量递减计入魔力。</dd>
        <dt>活跃周</dt><dd>有合入或协作的不同自然周（周一 0 点起，UTC+8）。</dd>
        <dt>合入率</dt><dd>合入 ÷ 已收尾。已收尾 = 合入 + 被他人关闭 + 打开超 ${R.staleOpenDays} 天未合；自己关闭的算撤回，不计入。</dd>
        <dt><span class="tag tag-warn">${icon('alert-triangle', 11)}合入率警告</span></dt><dd>已收尾越多，警告线越高。只提醒，不扣魔力，也不影响形态。<div class="gl-warn">${wl}</div></dd>
        <dt><span class="tag tag-sleep">${icon('moon-z', 11)}冬眠</span></dt><dd>${R.dormantDays} 天没有任何动作。只做标记；${N.LV[R.dormantExemptLevel].name}及以上豁免。</dd>
        <dt><span class="tag tag-out">组织外</span></dt><dd>数据更新时不在组织成员名单里的账号。贡献照常计分。</dd>
        <dt><span class="tag tag-warn">${icon('trending-down', 11)}掉队</span> <span class="tag tag-watch">${icon('eye', 11)}观察</span></dt><dd>按活力（0–100）判断：综合近期产出、持续度、历史信用与最近动作。低于 ${R.vitality.laggard} 为掉队，低于 ${R.vitality.watch} 为观察；首次贡献未满 ${R.newbie.days} 天不评。<a class="link" href="rules.html#vitality" data-screen="rules">公式</a></dd>
        <dt><span class="tag tag-warn">${icon('zap', 11)}新手异常</span></dt><dd>考核期内开了 ${R.newbie.anomaly.opened} 个以上 PR，合入的不到 ${fmt.pct(R.newbie.anomaly.rate)}。最近 ${R.newbie.anomaly.graceHours} 小时内开的 PR 不计。只做标记。</dd>
      </dl></div>`;
  })();
})();
</script>
</body>
